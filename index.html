<script>
"use strict";
/* ============================================ 6. GUESS / PICKER ========= */
var COUNTRIES=(function(){var o={};CANDIDATES.forEach(function(c){o[c.country]=1;});
  return Object.keys(o).sort();})();

/* Browsable wine picker: search, filter, grape list, then that grape's
   regions. Used for the taster's call, for the bottle reveal, and by
   practice mode.                                                        */
function winePicker(parent,opt){
  opt=opt||{};
  var st={q:'',color:opt.color||'',country:'',grapeId:opt.grapeId||null};
  var box=el('div');parent.appendChild(box);
  function draw(){
    box.innerHTML='';
    var search=el('input','inp');search.type='search';
    search.placeholder='Search grape, region or descriptor…';search.value=st.q;
    search.setAttribute('aria-label','Search wines');
    search.oninput=function(){st.q=search.value;st.grapeId=null;drawList();};
    box.appendChild(search);
    var filt=el('div','row');filt.style.margin='10px 0';
    [['','All'],['red','Red'],['white','White']].forEach(function(o){
      filt.appendChild(chip(o[1],st.color===o[0],function(){st.color=o[0];st.grapeId=null;draw();},'sm'));
    });
    var sel=el('select','inp');sel.style.maxWidth='190px';sel.style.minHeight='40px';
    sel.setAttribute('aria-label','Filter by country');
    var op0=el('option',null,'All countries');op0.value='';sel.appendChild(op0);
    COUNTRIES.forEach(function(c){var op=el('option',null,c);op.value=c;
      if(st.country===c)op.selected=true;sel.appendChild(op);});
    sel.onchange=function(){st.country=sel.value;st.grapeId=null;drawList();};
    filt.appendChild(sel);box.appendChild(filt);
    var list=el('div');box.appendChild(list);
    function drawList(){
      list.innerHTML='';
      if(st.grapeId){drawRegions(list);return;}
      var q=st.q.trim().toLowerCase();
      var gs=WINE_DB.filter(function(g){
        if(st.color&&g.color!==st.color)return false;
        if(st.country&&!(g.regions||[]).some(function(r){return r.country===st.country;}))return false;
        if(!q)return true;
        if((g.grape+' '+(g.aka||'')+' '+g.identity).toLowerCase().indexOf(q)>=0)return true;
        if((g.regions||[]).some(function(r){return (r.name+' '+(r.place||'')).toLowerCase().indexOf(q)>=0;}))return true;
        return (g.markerObjs||[]).some(function(m){return aromaLabel(m.note).toLowerCase().indexOf(q)>=0;});
      });
      if(!gs.length){list.appendChild(el('div','empty','Nothing matches that.'));return;}
      var grid=el('div','grid2');
      gs.forEach(function(g){
        var b=el('button','wcard');b.type='button';
        var t=el('div','row tight');
        var d=el('span','dot');d.style.background=g.color==='red'?'#8E1B2E':'#EDE199';
        t.appendChild(d);t.appendChild(el('b',null,g.grape));
        b.appendChild(t);
        b.appendChild(el('div','sub',(g.regions||[]).length+' region'+((g.regions||[]).length===1?'':'s')+
          (g.flight?' · classic flight':'')));
        b.onclick=function(){st.grapeId=g.id;drawList();};
        grid.appendChild(b);
      });
      list.appendChild(grid);
    }
    function drawRegions(list){
      var g=GRAPES[st.grapeId];
      var back=el('button','btn sm ghost','← All grapes');
      back.onclick=function(){st.grapeId=null;drawList();};
      list.appendChild(back);
      var h=el('h3',null,g.grape);h.style.margin='12px 0 2px';list.appendChild(h);
      list.appendChild(el('p','muted small',g.identity));
      var row=chipRow();
      (g.regions||[]).forEach(function(r){
        var cid=g.id+'::'+r.id;
        row.appendChild(chip(r.name,opt.selected===cid,function(){opt.onPick(cid,g,r);}));
      });
      list.appendChild(row);
    }
    drawList();
  }
  draw();
  return box;
}

function stepGuess(c){
  var s=sess();
  c.appendChild(el('h2',null,'Your call'));
  c.appendChild(el('p','muted small','Commit before the app shows its hand. Nothing on this screen is influenced by the deduction.'));
  s.guess=s.guess||{candId:null,vintage:null};
  var summary=el('div','card flat');
  function redraw(){
    summary.innerHTML='';
    if(s.guess.candId){
      var cd=CAND_BY_ID[s.guess.candId];
      summary.appendChild(el('div','tiny dim','YOUR CALL'));
      summary.appendChild(el('h3',null,cd.grape+' — '+cd.region));
      summary.appendChild(el('div','muted small',cd.place));
    } else summary.appendChild(el('div','muted small','No grape selected yet.'));
    var vrow=chipRow();vrow.style.marginTop='10px';
    VINTAGES.forEach(function(v){
      vrow.appendChild(chip(v[1],s.guess.vintage===v[0],function(){
        s.guess.vintage=(s.guess.vintage===v[0])?null:v[0];saveState();redraw();},'sm'));
    });
    summary.appendChild(el('div','tiny dim','VINTAGE RANGE'));
    summary.appendChild(vrow);
    var go=el('button','btn primary wide','Lock in and reveal');
    go.style.marginTop='14px';
    go.disabled=!s.guess.candId;
    go.onclick=function(){commitGuess(false);};
    summary.appendChild(go);
    var skip=el('button','btn ghost wide','No idea — skip to the answer');
    skip.style.marginTop='8px';
    skip.onclick=function(){s.guess={candId:null,vintage:null,skipped:true};commitGuess(true);};
    summary.appendChild(skip);
  }
  c.appendChild(summary);redraw();
  c.appendChild(el('hr','sep'));
  winePicker(c,{selected:s.guess.candId,onPick:function(cid){
    s.guess.candId=cid;s.guess.skipped=false;saveState();redraw();
    summary.scrollIntoView({behavior:'smooth',block:'center'});
  }});
  var back=el('button','btn ghost wide','← Back to the grid');
  back.style.marginTop='16px';
  back.onclick=function(){s.step=3;saveState();renderTaste();};
  c.appendChild(back);
}
function commitGuess(){
  var s=sess();
  var r=runInference(s.obs,{onlyCore:!S.settings.extraTypes});
  s.result=slimResult(r);
  s.step=5;
  if(s.mode==='practice'&&s.practiceWine){
    s.actual=s.practiceWine.candId;s.actualVintage=s.practiceWine.vintage;
    s.scored=slimScore(scoreGuess({candId:s.guess.candId,vintage:s.guess.vintage,
      actualVintage:s.actualVintage},s.actual));
  }
  saveState();recordHistory();renderTaste();
}
function slimResult(r){
  return {
    obsCount:r.obsCount,tellsFound:r.tellsFound,remaining:r.remaining,cap:r.cap,
    emptyPool:r.emptyPool||null,
    grapeRank:(r.grapeRank||[]).slice(0,6).map(function(g){
      return {grapeId:g.grapeId,grape:g.grape,confidence:g.confidence};}),
    top:r.top.map(function(s){
      return {candId:s.cand.id,grape:s.cand.grape,region:s.cand.region,place:s.cand.place,
        grapeId:s.cand.grapeId,confidence:s.confidence,match:s.match,
        grapeConfidence:s.grapeConfidence,
        siblings:(s.siblings||[]).map(function(x){return {region:x.cand.region,confidence:x.confidence};}),
        support:s.support.map(function(e){return e.t;}),
        contra:s.contra.map(function(e){return e.t;}),
        vetoes:s.vetoes,discriminator:s.discriminator};})
  };
}
function slimScore(sc){
  if(!sc)return null;
  return {score:sc.score,max:sc.max,pct:sc.pct,parts:sc.parts,verdict:sc.verdict,
    discriminator:sc.discriminator,grapeRight:sc.grapeRight,neighbour:sc.neighbour,
    guessId:sc.guess.id,actualId:sc.actual.id};
}
</script>
<script>
"use strict";
/* ================================================ 7. REVEAL ============= */
function confWord(p){return p>=60?'strong':p>=35?'moderate':p>=18?'tentative':'weak';}
function rankCard(t,i){
  /* imported history can be missing anything */
  t=t||{};t.support=t.support||[];t.contra=t.contra||[];t.siblings=t.siblings||[];
  t.grape=t.grape||'Unknown';t.region=t.region||'—';t.place=t.place||'';
  t.confidence=+t.confidence||0;t.match=+t.match||0;
  var box=el('div','rank'+(i===0?' top':''));
  var head=el('button','rhead');head.type='button';
  head.setAttribute('aria-expanded',i===0?'true':'false');
  head.appendChild(el('div','pos','#'+(i+1)));
  var nm=el('div','nm');
  nm.appendChild(el('b',null,t.grape));
  nm.appendChild(el('span',null,t.region+' · '+t.place));
  head.appendChild(nm);
  var cf=el('div','cf');
  cf.appendChild(el('b',null,Math.round(t.confidence)+'%'));
  cf.appendChild(el('div','tiny dim','match '+Math.round(t.match)));
  head.appendChild(cf);
  box.appendChild(head);
  var mb=el('div','mbar');var mi=el('i');mi.style.width=Math.round(t.match)+'%';mb.appendChild(mi);
  box.appendChild(mb);
  var body=el('div','rbody');
  if(i!==0)body.style.display='none';
  if(t.siblings&&t.siblings.length){
    var sib=el('div','tiny dim');
    sib.textContent='Same grape elsewhere: '+t.siblings.map(function(x){
      return x.region+' '+Math.round(x.confidence)+'%';}).join(' · ')+
      '  —  '+t.grape+' overall '+Math.round(t.grapeConfidence||t.confidence)+'%';
    sib.style.margin='8px 0 0';body.appendChild(sib);
  }
  if(t.support.length){
    body.appendChild(el('div','tiny dim','SUPPORTING EVIDENCE'));
    var ul=el('ul','ev');
    t.support.forEach(function(x){
      var li=el('li');li.appendChild(el('span','s','+'));li.appendChild(el('span',null,x));ul.appendChild(li);});
    body.appendChild(ul);
  }
  if(t.contra.length){
    body.appendChild(el('div','tiny dim','CONTRADICTING EVIDENCE'));
    var ul2=el('ul','ev');
    t.contra.forEach(function(x){
      var li=el('li');li.appendChild(el('span','c','−'));li.appendChild(el('span',null,x));ul2.appendChild(li);});
    body.appendChild(ul2);
  }
  if(!t.support.length&&!t.contra.length)
    body.appendChild(el('p','muted small','Nothing in the grid speaks either way — this candidate is here by elimination.'));
  if(t.discriminator){
    var d=el('div','disc');
    d.appendChild(el('b',null,i===0?'The discriminator — ':'To separate it from #1 — '));
    d.appendChild(el('span',null,t.discriminator));
    body.appendChild(d);
  }
  var open=el('button','btn sm ghost','Open in Codex');
  open.disabled=!CAND_BY_ID[t.candId];
  open.style.marginTop='10px';
  open.onclick=function(ev){ev.stopPropagation();closeModal();
    var c=CAND_BY_ID[t.candId];setView('codex',{grapeId:c.grapeId,regionId:c.regionId});};
  body.appendChild(open);
  box.appendChild(body);
  head.onclick=function(){
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    head.setAttribute('aria-expanded',open?'false':'true');
  };
  return box;
}
function stepReveal(c){
  var s=sess(),r=s.result;
  c.appendChild(el('h2',null,'The deduction'));
  if(r.emptyPool){
    var np=el('div','notice');
    np.appendChild(el('b',null,'No '+optLabel(WINE_TYPES,r.emptyPool).toLowerCase()+' wines in the database. '));
    np.appendChild(el('span',null,'Your grid was recorded in full, but there is nothing here to rank it against — this build carries reds and whites only. Switch the wine type to see a deduction.'));
    c.appendChild(np);
  }
  var meta=el('div','row');
  meta.appendChild(el('span','badge',r.obsCount+' observations'));
  meta.appendChild(el('span','badge',r.tellsFound+' diagnostic tell'+(r.tellsFound===1?'':'s')));
  meta.appendChild(el('span','badge','ceiling '+Math.round(r.cap)+'%'));
  if(s.peeked)meta.appendChild(el('span','badge peek','peeked'));
  meta.style.marginBottom='10px';c.appendChild(meta);
  if(r.obsCount<6)
    c.appendChild(el('p','muted small','Thin grid — the field below is wide and the confidences are deliberately low. This is an honest "not enough to say", not a shortlist.'));
  /* Headline the grape, not the village: when four addresses of one grape
     share the lead, the grape is the confident part of the answer.      */
  if(r.grapeRank&&r.grapeRank.length&&r.grapeRank[0]&&r.top[0]){
    var g0=r.grapeRank[0],lead=el('div','card flat');
    lead.style.borderLeft='4px solid var(--accent)';
    lead.appendChild(el('div','tiny dim','MOST LIKELY GRAPE'));
    var lr=el('div','spread');
    lr.appendChild(el('h3',null,g0.grape));
    var pc2=el('b',null,Math.round(g0.confidence)+'%');
    pc2.style.color='var(--accent2)';pc2.style.fontSize='1.35rem';
    lr.appendChild(pc2);
    lead.appendChild(lr);
    lead.appendChild(el('div','small muted',
      'Across every address in the database — '+confWord(g0.confidence)+'. '+
      (g0.grapeId===r.top[0].grapeId&&r.top[0].siblings&&r.top[0].siblings.length?
        'The village is the open question: '+r.top[0].region+' leads at '+Math.round(r.top[0].confidence)+'%.':
        'Best single address: '+r.top[0].grape+' from '+r.top[0].region+'.')));
    c.appendChild(lead);
  }

  /* your call vs the app's call */
  var cmp=el('div','card flat');
  cmp.appendChild(el('div','tiny dim','YOUR CALL VS THE APP’S CALL'));
  var g=s.guess&&s.guess.candId?CAND_BY_ID[s.guess.candId]:null;
  var row=el('div','spread');row.style.alignItems='flex-start';
  var left=el('div');left.style.flex='1';
  left.appendChild(el('div','tiny dim','YOU'));
  left.appendChild(el('b',null,g?g.grape:'— skipped —'));
  if(g)left.appendChild(el('div','small muted',g.region));
  var right=el('div');right.style.flex='1';right.style.textAlign='right';
  right.appendChild(el('div','tiny dim','THE APP'));
  right.appendChild(el('b',null,r.top[0]?r.top[0].grape:'—'));
  if(r.top[0]){
    var gc=r.grapeRank&&r.grapeRank[0]?r.grapeRank[0].confidence:r.top[0].confidence;
    right.appendChild(el('div','small muted',r.top[0].region));
    right.appendChild(el('div','tiny dim','grape '+Math.round(gc)+'% ('+confWord(gc)+
      ') · address '+Math.round(r.top[0].confidence)+'%'));
  }
  row.appendChild(left);row.appendChild(right);cmp.appendChild(row);
  if(g&&r.top[0]){
    var mine=null,rank=null;
    r.top.forEach(function(t,i){if(t.candId===g.id){mine=t;rank=i+1;}});
    if(g.id===r.top[0].candId)
      cmp.appendChild(el('p','small','We agree. That is a reason for mild confidence, not certainty — we read the same grid.'));
    else if(mine)
      cmp.appendChild(el('p','small','We disagree on the address but your call is #'+rank+' in the field. '+
        (mine.contra[0]?'The engine held it back because '+mine.contra[0]+'.':'')));
    else{
      var why=el('p','small');
      why.textContent='We diverge. '+(function(){
        var cand=CAND_BY_ID[g.id];
        var mock=runInference(s.obs,{onlyCore:!S.settings.extraTypes});
        var found=null;mock.all.forEach(function(x){if(x.cand.id===g.id)found=x;});
        if(!found)return 'Your pick is outside the ranked field entirely.';
        var pos=mock.all.indexOf(found)+1;
        return 'Your pick sits at #'+pos+' of '+mock.all.length+'. '+
          (found.contra[0]?'The grid argues against it because '+found.contra[0].t+'.':
           'Nothing in the grid excludes it — it simply had less corroborating evidence.');
      })();
      cmp.appendChild(why);
      var disc=el('div','disc');
      disc.appendChild(el('b',null,'Separate them — '));
      disc.appendChild(el('span',null,discriminatorBetween(r.top[0].candId,g.id)));
      cmp.appendChild(disc);
    }
  }
  c.appendChild(cmp);

  /* ranked field */
  if(r.top.length){
  c.appendChild(el('h3',null,'Ranked field'));
  r.top.forEach(function(t,i){c.appendChild(rankCard(t,i));});
  var rem=el('p','muted small');
  rem.textContent='Remaining field: '+Math.round(r.remaining)+'% spread across '+
    'the other candidates. Confidence is capped at '+Math.round(r.cap)+'% for a grid of this depth.';
  c.appendChild(rem);
  }
  if(r.grapeRank&&r.grapeRank.length){
    var gr=el('div','card flat');
    gr.appendChild(el('div','tiny dim','BY GRAPE (ALL ADDRESSES COMBINED)'));
    var pr=el('div','pillrow');
    r.grapeRank.slice(0,5).forEach(function(x){
      if(x.confidence<1)return;
      pr.appendChild(el('span','pill',x.grape+' '+Math.round(x.confidence)+'%'));});
    gr.appendChild(pr);c.appendChild(gr);
  }
  c.appendChild(el('hr','sep'));

  /* have I described a wine like this before? */
  /* Recording the bottle is a two-step commit: pick, then confirm. A
     mis-tap in a 53-item grid used to be final and unrecoverable.       */
  function commitBottle(cid){
    var nEl=$('bottleNote'),a=CAND_BY_ID[cid];
    if(nEl)s.note=nEl.value.trim();
    s.actual=cid;s.actualVintage=s.pendingVintage||null;s.pendingActual=null;
    s.scored=slimScore(scoreGuess({candId:s.guess.candId,vintage:s.guess.vintage,
      actualVintage:s.actualVintage},cid));
    saveState();recordHistory();renderTaste();
    toast('Recorded as '+(a?a.grape+' — '+a.region:'that wine')+'.');
  }
  function clearBottle(){
    s.actual=null;s.actualVintage=null;s.scored=null;
    s.pendingActual=null;s.pendingVintage=null;
    saveState();recordHistory();renderTaste();
    toast('Bottle cleared — record it again.');
  }
  /* adopting a recall match names the WINE only; the note and vintage
     belong to this bottle, so they come from this screen, not that one. */
  function adopt(h){s.pendingActual=h.actual;saveState();renderTaste();}
  if(s.mode!=='practice')
    similarPanel(c,s.obs,{excludeId:s.id,hideWhenEmpty:true,onUse:s.scored?null:adopt});

  /* the bottle */
  var act=el('div','card flat');
  act.appendChild(el('h3',null,'What was it actually?'));
  function noteField(){
    act.appendChild(el('div','tiny dim','LABEL NOTE (OPTIONAL)'));
    var n=el('input','inp');n.id='bottleNote';n.type='text';n.value=s.note||'';
    n.placeholder='Producer, vintage, whose cellar — anything to recognise it later';
    n.setAttribute('aria-label','Label note');
    n.onchange=function(){s.note=n.value.trim();saveState();recordHistory();};
    act.appendChild(n);
  }
  if(s.actual&&s.scored){
    renderScoreCard(act,s.scored);
    if(s.mode!=='practice'){
      var undo=el('button','btn sm ghost','Not that bottle — change it');
      undo.style.marginTop='10px';undo.onclick=clearBottle;
      act.appendChild(undo);
      act.appendChild(el('hr','sep'));
      noteField();
    }
  }else if(s.actual){
    /* bottle recorded but the call was skipped, so there is nothing to
       score against — say that instead of asking for the bottle again */
    var ab=CAND_BY_ID[s.actual];
    var ar=el('div','spread');
    var al=el('div');
    al.appendChild(el('div','tiny dim','IT WAS'));
    var abb=el('b',null,ab?ab.grape:'—');abb.style.fontSize='1.35rem';
    al.appendChild(abb);
    if(ab)al.appendChild(el('div','small muted',ab.region+' · '+ab.place));
    ar.appendChild(al);ar.appendChild(el('span','badge','not scored'));
    act.appendChild(ar);
    act.appendChild(el('p','muted small','You skipped the call, so there is nothing to score — but the bottle is logged, and a future grid like this one will find it.'));
    var undo2=el('button','btn sm ghost','Not that bottle — change it');
    undo2.onclick=clearBottle;act.appendChild(undo2);
    act.appendChild(el('hr','sep'));
    noteField();
  }else if(s.mode==='practice'&&s.practiceWine){
    /* skipped the guess, so there is no score to show — but the answer is
       sitting in s.actual and withholding it makes the drill useless */
    var pw=CAND_BY_ID[s.practiceWine.candId];
    var rev=el('div','spread');
    var rl=el('div');
    rl.appendChild(el('div','tiny dim','IT WAS'));
    var rb=el('b',null,pw?pw.grape:'—');rb.style.fontSize='1.35rem';
    rl.appendChild(rb);
    if(pw)rl.appendChild(el('div','small muted',pw.region+' · '+pw.place));
    rev.appendChild(rl);
    rev.appendChild(el('span','badge','not scored'));
    act.appendChild(rev);
    act.appendChild(el('p','muted small','You skipped the call, so there is nothing to score. '+
      (pw?'Read '+pw.grape+' in the Codex and run the drill again.':'')));
    if(pw){
      var cx=el('button','btn sm ghost','Open '+pw.grape+' in the Codex');
      cx.onclick=function(){setView('codex',{grapeId:pw.grapeId,regionId:pw.regionId});};
      act.appendChild(cx);
    }
  }else{
    act.appendChild(el('p','muted small','Enter the bottle to score this session, and so that a future grid like this one can find it. Skip it and the session is still logged, just unscored and invisible to recall.'));
    noteField();
    var vsel=el('div');
    var vr=chipRow();
    VINTAGES.forEach(function(v){
      vr.appendChild(chip(v[1],s.pendingVintage===v[0],function(){
        s.pendingVintage=(s.pendingVintage===v[0])?null:v[0];
        saveState();renderTaste();
      },'sm'));
    });
    act.appendChild(el('div','tiny dim','ACTUAL VINTAGE RANGE'));
    act.appendChild(vr);
    if(s.pendingActual&&CAND_BY_ID[s.pendingActual]){
      var pc=CAND_BY_ID[s.pendingActual],cf=el('div','pit');
      cf.style.borderLeftColor='var(--good)';
      cf.appendChild(el('div','pm','RECORD THIS BOTTLE?'));
      cf.appendChild(el('div','pw',pc.grape+' — '+pc.region));
      cf.appendChild(el('p','tiny dim',pc.place));
      cf.appendChild(el('p','tiny dim',s.pendingVintage?
        'Vintage bracket: '+optLabel(VINTAGES,s.pendingVintage):
        'No vintage bracket set — the vintage part of the score will be skipped.'));
      var cr=el('div','btnrow');
      var no=el('button','btn ghost','Not that one');
      no.onclick=function(){s.pendingActual=null;saveState();renderTaste();};
      var yes=el('button','btn primary','Record and score');
      yes.onclick=function(){commitBottle(s.pendingActual);};

<script>
"use strict";
/* ================================================ 8. CODEX ============== */

<script>
"use strict";
/* ================================================ 9. HISTORY =========== */
function scoredSessions(mode){
  return S.history.filter(function(h){
    return h.scored&&(!mode||h.mode===mode);}).sort(function(a,b){return a.ts-b.ts;});
}
function renderHistory(){
  var root=$('view-history');root.innerHTML='';
  $('ctxLabel').textContent='history';
  var head=el('div','card');
  head.appendChild(el('h2',null,'History'));
  if(!storage.available)
    head.appendChild((function(){var n=el('p','notice');
      n.appendChild(el('b',null,'Local storage unavailable. '));
      n.appendChild(el('span',null,'Sessions are held in memory only and will be lost when you close the tab. Export before you go.'));
      return n;})());
  var all=S.history.slice().sort(function(a,b){return b.ts-a.ts;});
  /* the headline figures are about real tastings; practice has its own
     record on the Practice tab, and its grids are generated             */
  var sc=scoredSessions('blind');
  var stats=el('div','row');
  stats.appendChild(el('span','badge',all.length+' session'+(all.length===1?'':'s')));
  stats.appendChild(el('span','badge',sc.length+' scored'));
  if(sc.length){
    var avg=Math.round(sc.reduce(function(a,h){return a+h.scored.pct;},0)/sc.length);
    stats.appendChild(el('span','badge'+(avg>=70?' ok':avg>=40?' warn':' bad'),'average '+avg+'/100'));
    var gr=sc.filter(function(h){return h.scored.grapeRight;}).length;
    stats.appendChild(el('span','badge','grape right '+Math.round(gr/sc.length*100)+'%'));
  }
  head.appendChild(stats);
  var tools=el('div','row');tools.style.marginTop='10px';
  var ex=el('button','btn sm ghost','Export JSON');ex.onclick=exportJSON;
  var im=el('button','btn sm ghost','Import JSON');im.onclick=importJSON;
  tools.appendChild(ex);tools.appendChild(im);head.appendChild(tools);
  root.appendChild(head);

  if(!all.length){
    root.appendChild(el('div','empty','No sessions yet. Taste something.'));
    return;
  }
  /* trend */
  if(sc.length>1){
    var tc=el('div','card');
    tc.appendChild(el('h3',null,'Accuracy trend'));
    var sp=el('div','spark');
    sc.slice(-30).forEach(function(h){
      var b=el('i');b.style.height=Math.max(4,h.scored.pct)+'%';
      b.style.background=h.scored.pct>=70?'var(--good)':h.scored.pct>=40?'var(--warn)':'var(--bad)';
      b.title=fmtDate(h.ts)+' — '+h.scored.pct+'/100';
      sp.appendChild(b);
    });
    tc.appendChild(sp);
    tc.appendChild(el('div','tiny dim','Last '+Math.min(30,sc.length)+' scored sessions, oldest first.'));
    root.appendChild(tc);
  }
  /* by grape */
  var byGrape={};
  sc.forEach(function(h){
    var a=CAND_BY_ID[h.scored.actualId];if(!a)return;
    var k=a.grapeId;byGrape[k]=byGrape[k]||{grape:a.grape,n:0,right:0,pts:0};
    byGrape[k].n++;byGrape[k].pts+=h.scored.pct;
    if(h.scored.grapeRight)byGrape[k].right++;
  });
  var gk=Object.keys(byGrape).sort(function(a,b){
    return (byGrape[a].right/byGrape[a].n)-(byGrape[b].right/byGrape[b].n);});
  if(gk.length){
    var gc=el('div','card');
    gc.appendChild(el('h3',null,'Accuracy by grape'));
    gc.appendChild(el('p','tiny dim','Weakest first — practice mode draws from the top of this list.'));
    var tb=el('table','tbl');
    var hr=el('tr');['Grape','Seen','Grape right','Avg'].forEach(function(x){hr.appendChild(el('th',null,x));});
    tb.appendChild(hr);
    gk.forEach(function(k){
      var r=byGrape[k],tr=el('tr');
      var td=el('td');var b=el('button','btn sm ghost',r.grape);
      b.onclick=function(){setView('codex',{grapeId:k});};td.appendChild(b);tr.appendChild(td);
      tr.appendChild(el('td',null,String(r.n)));
      tr.appendChild(el('td',null,Math.round(r.right/r.n*100)+'%'));
      tr.appendChild(el('td',null,Math.round(r.pts/r.n)+''));
      tb.appendChild(tr);
    });
    gc.appendChild(tb);root.appendChild(gc);
  }
  /* confused pairs */
  var pairs={};
  sc.forEach(function(h){
    if(h.scored.grapeRight)return;
    var a=CAND_BY_ID[h.scored.actualId],g=CAND_BY_ID[h.scored.guessId];
    if(!a||!g)return;
    var k=a.grapeId+'>'+g.grapeId;
    pairs[k]=pairs[k]||{actual:a.grapeId,actualName:a.grape,guess:g.grapeId,guessName:g.grape,n:0};
    pairs[k].n++;
  });
  var pk=Object.keys(pairs).sort(function(a,b){return pairs[b].n-pairs[a].n;});
  if(pk.length){
    var pc=el('div','card');
    pc.appendChild(el('h3',null,'Your most confused pairs'));
    var tb2=el('table','tbl');
    var hr2=el('tr');['It was','You said','Times',''].forEach(function(x){hr2.appendChild(el('th',null,x));});
    tb2.appendChild(hr2);
    pk.slice(0,12).forEach(function(k){
      var p=pairs[k],tr=el('tr');
      tr.appendChild(el('td',null,p.actualName));
      tr.appendChild(el('td',null,p.guessName));
      tr.appendChild(el('td',null,String(p.n)));

  }
  /* the log — every entry, newest first, with what you called, what the
     app called, and what it turned out to be */
  var lc=el('div','card');
  var lh=el('div','spread');
  lh.appendChild(el('h3',null,'Log'));
  var lcount=el('span','tiny dim');
  lh.appendChild(lcount);

  var fr=el('div','row');fr.style.margin='0 0 12px';
  [['all','All'],['blind','Blind'],['practice','Practice'],
   ['scored','Scored'],['unscored','Unscored'],['peeked','Peeked']].forEach(function(f){
    fr.appendChild(chip(f[1],S.logFilter===f[0],function(){
      S.logFilter=f[0];renderHistory();},'sm'));

    var f=S.logFilter||'all';

  });
  lcount.textContent=rows.length+' entr'+(rows.length===1?'y':'ies')+
    (rows.length!==all.length?' of '+all.length:'');
  if(!rows.length)lc.appendChild(el('div','empty','No entries match that filter.'));
  rows.slice(0,120).forEach(function(h){
    var a=h.actual?CAND_BY_ID[h.actual]:null;
    var gsd=h.guess&&h.guess.candId?CAND_BY_ID[h.guess.candId]:null;
    var app=h.result&&h.result.top&&h.result.top[0]?h.result.top[0]:null;
    var row=el('div','logrow'+(h.peeked?' flagged':''));
    var head=el('div','lhead');
    var meta=el('div');
    meta.appendChild(el('div','when',fmtDate(h.ts)));
    var tags=el('div','row tight');tags.style.marginTop='4px';
    tags.appendChild(el('span','badge',h.mode));
    if(h.flashcard)tags.appendChild(el('span','badge','flashcard'));
    if(h.peeked)tags.appendChild(el('span','badge peek','peeked'));

    if(h.scored){
      var sv=el('div','logscore');

      n.style.color=h.scored.pct>=70?'var(--good2)':h.scored.pct>=40?'var(--warn)':'var(--bad)';
      sv.appendChild(n);sv.appendChild(el('div','tiny dim','/100'));

    }

    function line(lab,txt,cls){

      d.appendChild(el('b',null,lab));d.appendChild(el('span',null,txt));

    }
    line('You',gsd?gsd.grape+' — '+gsd.region:'skipped the call',
      h.scored?(h.scored.grapeRight?'hit':'miss'):'');
    if(app)line('App',app.grape+' — '+app.region+' · '+Math.round(app.confidence)+'%');
    line('Was',a?a.grape+' — '+a.region:'not recorded');
    if(h.note)line('Note','“'+h.note+'”');
    var acts=el('div','row');acts.style.marginTop='8px';
    var open=el('button','btn sm ghost','Open');

    del.onclick=function(){deleteSession(h.id);};

  if(rows.length>120)
    lc.appendChild(el('p','tiny dim','Showing the most recent 120 of '+rows.length+'. Export for the full record.'));
  root.appendChild(lc);
}
/* Remove a logged session. If it is the one currently open, the live
   session is reset too, so the app is never pointing at a deleted row. */
function deleteSession(id,then){
  var h=null;S.history.forEach(function(x){if(x.id===id)h=x;});

}
function openSession(h){

    else sh.appendChild(el('p','muted small','Nothing was recorded on the grid for this session.'));
    var del=el('button','btn ghost wide','Delete this entry');

}
function exportJSON(){
  var payload={app:'blind',version:1,exported:new Date().toISOString(),

    sh.appendChild(el('p','muted small',S.history.length+' sessions. Download the file, or copy the text below.'));

      var blob=new Blob([txt],{type:'application/json'});

      a.href=URL.createObjectURL(blob);a.download='blind-history.json';

    }catch(e){/* some file:// contexts block Blob URLs — the textarea still works */}
    var ta=el('textarea','inp');ta.value=txt;ta.readOnly=true;ta.style.marginTop='10px';
    ta.style.minHeight='180px';sh.appendChild(ta);
    var cp=el('button','btn ghost wide','Select all');
    cp.style.marginTop='8px';cp.onclick=function(){ta.focus();ta.select();};
    sh.appendChild(cp);
  });
}
function importJSON(){
  openModal('Import',function(sh){
    sh.appendChild(el('p','muted small','Paste an exported file, or choose one. Imported sessions are merged by id; nothing is overwritten unless the id matches.'));
    var fi=el('input','inp');fi.type='file';fi.accept='application/json,.json';
    fi.onchange=function(){
      var f=fi.files&&fi.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){ta.value=String(fr.result);};
      fr.readAsText(f);
    };
    sh.appendChild(fi);
    var ta=el('textarea','inp');ta.placeholder='{ "app": "blind", ... }';ta.style.marginTop='10px';
    sh.appendChild(ta);
    var go=el('button','btn primary wide','Merge into history');go.style.marginTop='10px';
    go.onclick=function(){
      var o;try{o=JSON.parse(ta.value);}catch(e){return toast('That is not valid JSON.');}
      if(!o||!Array.isArray(o.history))return toast('No history array found.');
      var seen={};S.history.forEach(function(h,i){seen[h.id]=i;});
      var added=0,updated=0;
      o.history.forEach(function(h){
        if(!h||!h.id||!h.ts)return;
        if(seen[h.id]!=null){S.history[seen[h.id]]=h;updated++;}
        else{S.history.push(h);added++;}
      });
      if(o.settings)S.settings=Object.assign(S.settings,o.settings);
      saveState();closeModal();renderHistory();
      toast(added+' added, '+updated+' updated.');
    };
    sh.appendChild(go);
  });
}

<script>
"use strict";
/* ========================================= 9b. GRID RECALL ==============
   "Have I described a wine like this before?"  Compares the current grid
   against every past session where the bottle was recorded, and reports
   the ones that match above a threshold the taster controls.

   The comparison only looks at fields BOTH grids answered, which is the
   same rule the inference engine uses: a field you skipped on either
   occasion cannot make two notes look alike or unalike.               */

var MIN_OVERLAP=5;      /* fewer shared fields than this and a % is noise */
var AROMA_SIM_W=3.0;    /* aromas are the most distinctive thing in a note */
var SIM_FIELDS=[
 {k:'wineType',t:'cat',w:1.5,hard:true,label:'wine type'},
 {k:'hue',t:'hue',w:1.2,label:'hue'},
 {k:'concentration',t:'ord',scale:'concentration',w:1.0,label:'concentration'},
 {k:'clarity',t:'cat',w:0.3,label:'clarity'},
 {k:'rim',t:'cat',w:0.3,label:'rim'},
 {k:'legs',t:'cat',w:0.3,label:'legs'},
 {k:'gumStain',t:'cat',w:0.3,label:'gum staining'},
 {k:'bubbles',t:'cat',w:0.3,label:'bubbles'},
 {k:'noseIntensity',t:'ord',scale:'intensity',w:0.5,label:'aromatic intensity'},
 {k:'sweetness',t:'ord',scale:'sweetness',w:1.0,label:'sweetness'},
 {k:'acidity',t:'ord',scale:'acidity',w:1.2,label:'acidity'},
 {k:'tannin',t:'ord',scale:'tannin',w:1.2,label:'tannin'},
 {k:'alcohol',t:'ord',scale:'alcohol',w:1.0,label:'alcohol'},
 {k:'body',t:'ord',scale:'body',w:1.0,label:'body'},
 {k:'flavorIntensity',t:'ord',scale:'intensity',w:0.5,label:'flavour intensity'},
 {k:'finish',t:'ord',scale:'finish',w:0.6,label:'finish'},
 {k:'balance',t:'cat',w:0.3,label:'balance'},
 {k:'finishesOn',t:'cat',w:0.3,label:'where it finishes'},
 {k:'quality',t:'cat',w:0.3,label:'quality'},
 {k:'world',t:'cat',w:0.5,label:'Old/New World'},
 {k:'climate',t:'clim',w:0.5,label:'climate'},
 {k:'vintage',t:'vint',w:0.5,label:'vintage range'},
 {k:'condition',t:'set',w:0.8,label:'fruit condition'},
 {k:'tanninTexture',t:'set',w:0.6,label:'tannin texture'},
 {k:'mouthfeel',t:'set',w:0.6,label:'mouthfeel'},
 {k:'palateOnly',t:'set',w:0.5,label:'palate descriptors'},
 {k:'winemaking',t:'set',w:0.6,label:'winemaking'}
];
var VINT_ORDER=VINTAGES.map(function(v){return v[0];});

function setOf(v){
  var o={};
  if(Array.isArray(v))v.forEach(function(k){o[k]=true;});
  else if(v&&typeof v==='object')Object.keys(v).forEach(function(k){if(v[k])o[k]=true;});
  return o;
}
function jaccard(a,b){
  var ka=Object.keys(a),kb=Object.keys(b);
  if(!ka.length&&!kb.length)return null;
  var inter=ka.filter(function(k){return b[k];}).length;
  var union=ka.length+kb.length-inter;
  return {sim:union?inter/union:0,shared:ka.filter(function(k){return b[k];})};
}
function ordSim(a,b,scale){
  var len=(SCALES[scale]||[]).length||6;
  return 1-Math.abs(a-b)/(len-1);
}
/* 0-100 similarity between two recorded grids, plus what drove it. */
function gridSimilarity(A,B){
  if(!A||!B)return null;
  var score=0,weight=0,overlap=0,agree=[],differ=[];
  for(var i=0;i<SIM_FIELDS.length;i++){
    var f=SIM_FIELDS[i],a=A[f.k],b=B[f.k],sim=null,sh=null;
    if(f.t==='set'){
      var sa=setOf(a),sb=setOf(b);
      if(!Object.keys(sa).length||!Object.keys(sb).length)continue;
      var j=jaccard(sa,sb);sim=j.sim;sh=j.shared;
    }else{
      if(a==null||a===''||b==null||b==='')continue;
      if(f.t==='ord')sim=ordSim(a,b,f.scale);
      else if(f.t==='hue'){
        var ha=HUE_INDEX[a],hb=HUE_INDEX[b];
        if(!ha||!hb)sim=a===b?1:0;
        else if(ha.fam!==hb.fam)sim=0;
        else sim=1-Math.abs(ha.i-hb.i)/Math.max(1,(HUES[ha.fam].length-1));
      }
      else if(f.t==='clim')sim=1-Math.abs((CLIMATE_ORD[a]||2)-(CLIMATE_ORD[b]||2))/2;
      else if(f.t==='vint')sim=1-Math.abs(VINT_ORDER.indexOf(a)-VINT_ORDER.indexOf(b))/(VINT_ORDER.length-1);
      else sim=a===b?1:0;
      /* a red note and a white note are not versions of the same note */
      if(f.hard&&sim===0)return {pct:0,overlap:0,agree:[],differ:[],blocked:f.label};
    }
    sim=clamp(sim,0,1);
    score+=sim*f.w;weight+=f.w;overlap++;
    if(sim>=0.999)agree.push(f.label);
    else if(sim<=0.34)differ.push(f.label);
  }
  /* aromas: nose plus palate confirmations, compared as one set */
  var aa=obsAromaSet(A),ab=obsAromaSet(B);
  var shared=[];
  if(Object.keys(aa).length&&Object.keys(ab).length){
    var ja=jaccard(aa,ab);
    score+=ja.sim*AROMA_SIM_W;weight+=AROMA_SIM_W;overlap++;
    shared=ja.shared;
    if(ja.sim>=0.6)agree.push('aromas');else if(ja.sim<=0.2)differ.push('aromas');
  }
  if(!weight)return null;
  return {pct:Math.round(score/weight*100),overlap:overlap,
    agree:agree,differ:differ,sharedAromas:shared};
}
/* Past sessions whose grid resembles this one. Practice drills are left
   out on purpose: their grids are generated, not observed.            */
function findSimilarSessions(obs,opts){
  opts=opts||{};
  var min=opts.threshold!=null?opts.threshold:matchThreshold();
  var exclude=opts.excludeId||null;
  var out=[],skippedUnlabelled=0,thin=0;
  S.history.forEach(function(h){
    if(!h||h.id===exclude)return;
    if(h.mode==='practice')return;
    if(!h.obs)return;
    if(!h.actual&&!opts.includeUnlabelled){skippedUnlabelled++;return;}
    var sim=gridSimilarity(obs,h.obs);
    if(!sim||sim.blocked)return;
    if(sim.overlap<MIN_OVERLAP){thin++;return;}
    if(sim.pct<min)return;
    out.push({entry:h,sim:sim});
  });
  out.sort(function(a,b){return b.sim.pct-a.sim.pct||b.entry.ts-a.entry.ts;});
  return {matches:out,skippedUnlabelled:skippedUnlabelled,tooThin:thin,threshold:min};
}
function matchThreshold(){
  var t=parseInt(S.settings.matchThreshold,10);
  return isNaN(t)?80:clamp(t,30,99);
}
/* Shared renderer. `onUse` is offered when the taster can adopt a match
   as this session's bottle.                                           */
function similarPanel(parent,obs,opts){
  opts=opts||{};
  var res=findSimilarSessions(obs,opts);
  var box=el('div','card flat');
  box.appendChild(el('div','tiny dim','YOUR PAST NOTES'));
  var head=el('div','spread');
  head.appendChild(el('h3',null,res.matches.length?
    (res.matches.length+' earlier note'+(res.matches.length===1?'':'s')+' like this one'):
    'Nothing like this in your notes'));
  head.appendChild(el('span','badge','≥ '+res.threshold+'%'));
  box.appendChild(head);
  if(!res.matches.length&&opts.hideWhenEmpty)return res;
  if(!res.matches.length){
    var why=[];
    if(res.skippedUnlabelled)why.push(res.skippedUnlabelled+' past session'+
      (res.skippedUnlabelled===1?'':'s')+' had no bottle recorded');
    if(res.tooThin)why.push(res.tooThin+' had too few fields in common to compare');
    box.appendChild(el('p','muted small',
      'No past session matches this grid at '+res.threshold+'% or better.'+
      (why.length?' ('+listSentence(why)+'.)':'')+
      ' Lower the threshold in Settings if you want looser matches.'));
    parent.appendChild(box);return res;
  }
  res.matches.slice(0,opts.limit||6).forEach(function(m){
    var h=m.entry,a=h.actual?CAND_BY_ID[h.actual]:null;
    var row=el('div','pit');row.style.borderLeftColor='var(--good)';
    var top=el('div','spread');
    var l=el('div');l.style.minWidth='0';
    l.appendChild(el('b',null,a?a.grape+' — '+a.region:'Unlabelled session'));
    l.appendChild(el('div','tiny dim',fmtDate(h.ts)+(h.peeked?' · peeked':'')));
    top.appendChild(l);
    var pc=el('div');pc.style.textAlign='right';
    var n=el('b',null,m.sim.pct+'%');n.style.color='var(--good2)';n.style.fontSize='1.2rem';
    pc.appendChild(n);
    pc.appendChild(el('div','tiny dim',m.sim.overlap+' fields compared'));
    top.appendChild(pc);
    row.appendChild(top);
    if(h.note)row.appendChild(el('p','small','“'+h.note+'”'));
    if(m.sim.sharedAromas.length)
      row.appendChild(el('p','tiny dim','Both times you noted '+
        listSentence(m.sim.sharedAromas.slice(0,6).map(aromaLabel).map(function(x){
          return x.toLowerCase();}))+'.'));
    if(m.sim.differ.length)
      row.appendChild(el('p','tiny dim','Differs on '+listSentence(m.sim.differ.slice(0,4))+'.'));
    var acts=el('div','row');
    if(opts.onUse&&a){
      var use=el('button','btn sm','Use as the bottle');
      use.onclick=function(){opts.onUse(h);};
      acts.appendChild(use);
    }
    var open=el('button','btn sm ghost','Open session');
    open.onclick=function(){openSession(h);};
    acts.appendChild(open);
    if(a){
      var cx=el('button','btn sm ghost','Codex');
      cx.onclick=function(){closeModal();setView('codex',{grapeId:a.grapeId,regionId:a.regionId});};
      acts.appendChild(cx);
    }
    row.appendChild(acts);
    box.appendChild(row);
  });
  var lim=opts.limit||6;
  if(res.matches.length>lim)
    box.appendChild(el('p','tiny dim','and '+(res.matches.length-lim)+
      ' more below the top '+lim+'.'));
  parent.appendChild(box);
  return res;
}
</script>
<script>
"use strict";
/* ================================================ 10. PRACTICE ========== */
function mid(r,d){return r?Math.round((r[0]+r[1])/2):(d||null);}
/* Turn a database entry back into a set of observations, then into prose.
   The engine then reads exactly what the taster reads.                  */
function buildProfile(c){
  var obs={aromas:{},palateConfirm:{}};
  obs.wineType=c.color;obs.clarity='clear';
  obs.concentration=mid(c.ranges.concentration,3);
  obs.hue=c.hues[Math.floor(c.hues.length/2)]||c.hues[0];
  obs.acidity=mid(c.ranges.acidity,3);
  if(c.color==='red')obs.tannin=mid(c.ranges.tannin,3);
  obs.alcohol=mid(c.ranges.alcohol,3);
  obs.body=mid(c.ranges.body,3);
  obs.sweetness=mid(c.ranges.sweetness,2);
  obs.finish=mid(c.ranges.finish,2);
  obs.noseIntensity=4;obs.flavorIntensity=obs.noseIntensity;
  var marks=c.markers.slice().sort(function(a,b){return b.w-a.w;});
  var pick=marks.filter(function(m){return m.w>=3;}).slice(0,5)
    .concat(marks.filter(function(m){return m.w===2;}).slice(0,4));
  if(pick.length<5)pick=marks.slice(0,6);
  obs.condition=[];
  pick.forEach(function(m){
    if(AROMA[m.note]&&AROMA[m.note].group==='condition')obs.condition.push(m.note);
    else obs.aromas[m.note]=true;});
  pick.slice(0,3).forEach(function(m){
    if(!AROMA[m.note]||AROMA[m.note].group!=='condition')obs.palateConfirm[m.note]=true;});
  if(c.texture&&c.texture.length){
    obs.tanninTexture=c.color==='red'?c.texture.filter(function(t){return TANNIN_TEXTURE.indexOf(t)>=0;}):[];
    obs.mouthfeel=c.texture.filter(function(t){return MOUTHFEEL.indexOf(t)>=0;});
  }
  var ageGated=marks.filter(function(m){return m.ageGated;});
  var vintage=ageGated.length?(ageGated[0].ageGated>=10?'10-20':'5-10'):'3-5';
  var text={
    colour:'Clear, '+scaleLabel('concentration',obs.concentration)+' concentration, '+
      (HUE_INDEX[obs.hue]?HUE_INDEX[obs.hue].name:obs.hue)+' in the core.',
    nose:'Aromatic intensity medium+ to pronounced: '+
      listSentence(pick.map(function(m){return aromaLabel(m.note).toLowerCase();}))+'.',
    palate:(c.color==='red'?
      scaleLabel('acidity',obs.acidity)+' acidity, '+scaleLabel('tannin',obs.tannin)+' tannin'+
        (obs.tanninTexture&&obs.tanninTexture.length?' ('+obs.tanninTexture.join(', ')+')':'')
      :scaleLabel('acidity',obs.acidity)+' acidity')+
      ', '+scaleLabel('alcohol',obs.alcohol)+' alcohol, '+scaleLabel('body',obs.body)+' body, '+
      scaleLabel('sweetness',obs.sweetness)+'.',
    finish:'Finish '+scaleLabel('finish',obs.finish)+
      (obs.mouthfeel&&obs.mouthfeel.length?'; texture '+obs.mouthfeel.join(', '):'')+'.'
  };
  return {candId:c.id,obs:obs,text:text,vintage:vintage,tells:(c.tells||[]).slice()};
}
function pickPracticeWine(){
  var miss={};
  scoredSessions().forEach(function(h){
    var a=CAND_BY_ID[h.scored.actualId];if(!a)return;
    miss[a.grapeId]=(miss[a.grapeId]||0)+(h.scored.grapeRight?0:1);
  });
  var pool=CANDIDATES.filter(function(c){
    return S.settings.extraTypes||CORE_TYPES.indexOf(c.color)>=0;});
  var weights=pool.map(function(c){
    return (c.flight?1.6:1)*(1+2*(miss[c.grapeId]||0));});
  var total=weights.reduce(function(a,b){return a+b;},0);
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
function startPractice(flashcard){
  var c=pickPracticeWine(),p=buildProfile(c);
  var s=newSession('practice',{candId:c.id,vintage:p.vintage});
  s.obs=p.obs;s.profile=p;s.flashcard=!!flashcard;s.step=4;
  saveState();setView('taste');
}
function renderPracticeBrief(card){
  var s=sess(),p=s.profile;if(!p)return;
  var b=el('div','card flat');b.style.borderLeft='4px solid var(--accent2)';
  b.appendChild(el('div','tiny dim',s.flashcard?'FLASHCARD — DIAGNOSTIC TELLS ONLY':'GENERATED TASTING NOTE'));
  if(s.flashcard){
    var ul=el('ul','ev');
    /* belt and braces: a flashcard must never print its own answer */
    var cd=CAND_BY_ID[p.candId]||{},names=[cd.grape,cd.aka,cd.region]
      .filter(Boolean).join(' / ').split(/\s*[\/,]\s*/)
      .filter(function(n){return n.length>3;});
    var safe=p.tells.filter(function(t){
      return !names.some(function(n){return t.toLowerCase().indexOf(n.toLowerCase())>=0;});});
    (safe.length?safe:[p.text.nose]).forEach(function(t){
      var li=el('li');li.appendChild(el('span','s','◆'));li.appendChild(el('span',null,t));ul.appendChild(li);});
    b.appendChild(ul);
  }else{
    [['Colour',p.text.colour],['Nose',p.text.nose],['Palate',p.text.palate],['Finish',p.text.finish]]
      .forEach(function(x){
        var d=el('div');d.style.marginBottom='8px';
        d.appendChild(el('div','tiny dim',x[0].toUpperCase()));
        d.appendChild(el('div','small',x[1]));b.appendChild(d);});
  }
  card.appendChild(b);
}
function renderPractice(){
  var root=$('view-practice');root.innerHTML='';
  $('ctxLabel').textContent='practice';
  var c=el('div','card');
  c.appendChild(el('h2',null,'Practice'));
  c.appendChild(el('p','muted small','The drill runs backwards: the app describes a wine and you name it. Sessions are logged separately from real tastings.'));
  var b1=el('button','btn primary wide','Start a tasting-note drill');
  b1.onclick=function(){startPractice(false);};
  var b2=el('button','btn ghost wide','Flashcard — tells only');
  b2.style.marginTop='10px';b2.onclick=function(){startPractice(true);};
  c.appendChild(b1);c.appendChild(b2);
  var pool=CANDIDATES.filter(function(x){return S.settings.extraTypes||CORE_TYPES.indexOf(x.color)>=0;});
  c.appendChild(el('p','tiny dim','Drawing from '+pool.length+' addresses across '+WINE_DB.length+
    ' grapes, weighted toward the grapes you have missed.'));
  root.appendChild(c);
  var ps=scoredSessions('practice');
  if(ps.length){
    var st=el('div','card');
    st.appendChild(el('h3',null,'Practice record'));
    var avg=Math.round(ps.reduce(function(a,h){return a+h.scored.pct;},0)/ps.length);
    var gr=ps.filter(function(h){return h.scored.grapeRight;}).length;
    var row=el('div','row');
    row.appendChild(el('span','badge',ps.length+' drills'));
    row.appendChild(el('span','badge'+(avg>=70?' ok':avg>=40?' warn':' bad'),'average '+avg+'/100'));
    row.appendChild(el('span','badge','grape right '+Math.round(gr/ps.length*100)+'%'));
    st.appendChild(row);
    var last=ps.slice(-10).reverse(),tb=el('table','tbl');
    var hr=el('tr');['Wine','You said','Score'].forEach(function(x){hr.appendChild(el('th',null,x));});
    tb.appendChild(hr);
    last.forEach(function(h){
      var a=CAND_BY_ID[h.scored.actualId],g=CAND_BY_ID[h.scored.guessId];
      var tr=el('tr');
      tr.appendChild(el('td',null,a?a.grape+' / '+a.region:'?'));
      tr.appendChild(el('td',null,g?g.grape:'—'));
      tr.appendChild(el('td',null,h.scored.pct+''));
      tb.appendChild(tr);
    });
    st.appendChild(tb);root.appendChild(st);
  }
}

/* ================================================ 11. SETTINGS / BOOT === */
function settingsModal(){
  openModal('Settings',function(sh){
    function toggle(label,hint,key,after){
      var w=el('div','field'),l=el('div','flabel');
      l.appendChild(el('b',null,label));if(hint)l.appendChild(el('span','hint',hint));
      w.appendChild(l);
      var row=chipRow();
      row.appendChild(chip(S.settings[key]?'On':'Off',!!S.settings[key],function(){
        S.settings[key]=!S.settings[key];saveState();closeModal();settingsModal();
        if(after)after();
      }));
      w.appendChild(row);sh.appendChild(w);
    }
    var tw=el('div','field'),tl=el('div','flabel');
    tl.appendChild(el('b',null,'Theme'));tw.appendChild(tl);
    var tr=chipRow();
    [['dark','Dark'],['light','Light']].forEach(function(o){
      tr.appendChild(chip(o[1],S.theme===o[0],function(){
        S.theme=o[0];applyTheme();saveState();closeModal();settingsModal();}));});
    tw.appendChild(tr);sh.appendChild(tw);
    toggle('Rosé, sparkling and fortified','adds the wine types to the grid — note the database itself carries reds and whites only','extraTypes',function(){renderTaste();});
    toggle('Allow tannin on whites','for skin-contact and orange wines','tanninOnWhites',function(){renderTaste();});
    toggle('Highlight diagnostic tells','the ◆ accent on high-signal aroma chips','showTells',function(){renderTaste();});
    var mw=el('div','field'),ml=el('div','flabel');
    ml.appendChild(el('b',null,'Recall threshold'));
    ml.appendChild(el('span','hint','how alike two grids must be before a past note is listed'));
    mw.appendChild(ml);
    var mr=chipRow();
    [50,60,70,80,90,95].forEach(function(v){
      mr.appendChild(chip(v+'%',matchThreshold()===v,function(){
        S.settings.matchThreshold=v;saveState();closeModal();settingsModal();},'scale'));
    });
    mw.appendChild(mr);
    mw.appendChild(el('div','tiny dim','Only fields you filled in on both occasions are compared, and at least '+
      MIN_OVERLAP+' of them must overlap. Practice drills are excluded — their grids are generated, not observed.'));
    sh.appendChild(mw);
    sh.appendChild(el('hr','sep'));
    var info=el('div','muted small');
    info.textContent=WINE_DB.length+' grapes · '+CANDIDATES.length+' regional expressions · '+
      AROMA_LIST.length+' aroma chips · storage '+(storage.available?'available':'UNAVAILABLE (in-memory only)');
    sh.appendChild(info);
    var vb=el('button','btn sm ghost','Run data self-check');
    vb.style.marginTop='10px';
    vb.onclick=function(){
      var v=validateDB();
      toast(v.errors.length?v.errors.length+' data errors — see console':
        'Data clean: '+v.grapes+' grapes, '+v.candidates+' addresses.',3500);
      if(v.errors.length&&window.console)console.warn(v.errors);
    };
    sh.appendChild(vb);
    var reset=el('button','btn sm ghost','Erase all history');
    reset.style.marginTop='10px';reset.style.marginLeft='8px';
    reset.onclick=function(){
      openModal('Erase all history?',function(s2){
        s2.appendChild(el('p','muted','Every logged session is deleted. Export first if you want a copy. This cannot be undone.'));
        var r=el('div','btnrow');
        var no=el('button','btn ghost','Cancel');no.onclick=closeModal;
        var yes=el('button','btn primary','Erase everything');
        yes.onclick=function(){S.history=[];saveState();closeModal();renderHistory();toast('History erased.');};
        r.appendChild(no);r.appendChild(yes);s2.appendChild(r);
      });
    };
    sh.appendChild(reset);
  });
}
function boot(){
  loadState();
  applyTheme();
  (function(){
    var bar=document.querySelector('.appbar');
    function sync(){if(bar)document.documentElement.style
      .setProperty('--appbar-h',bar.offsetHeight+'px');}
    sync();window.addEventListener('resize',sync);
  })();
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(b){
    b.onclick=function(){setView(b.dataset.view);};
  });
  $('btnTheme').onclick=function(){
    S.theme=S.theme==='dark'?'light':'dark';applyTheme();saveState();
    toast(S.theme==='dark'?'Dark':'Light');
  };
  $('btnSettings').onclick=settingsModal;
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&$('modal').classList.contains('on'))closeModal();
  });
  if(!S.session)newSession('blind');
  if(S.session.mode==='practice'&&!S.session.profile&&S.session.practiceWine){
    /* a practice session restored from an older payload — rebuild its brief */
    var c=CAND_BY_ID[S.session.practiceWine.candId];
    if(c)S.session.profile=buildProfile(c);
  }
  setView('taste');
  if(window.console){
    var v=validateDB();
    if(v.errors.length)console.warn('WINE_DB issues:',v.errors);
  }
}
if(typeof document!=='undefined'&&document.addEventListener)
  document.addEventListener('DOMContentLoaded',boot);
</script>
