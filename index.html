<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Blind — deductive tasting</title>
<style>
/* ============================================================ THEME ===== */
:root{
  --bg:#131011; --bg2:#1a1617; --panel:#201b1d; --panel2:#272122; --line:#3a3133;
  --line2:#4a4042; --txt:#f4eeee; --txt2:#c9bcbe; --txt3:#9d8f91;
  --accent:#a51f3c; --accent2:#cf4a63; --accent-dim:#5c1424;
  --good:#3f9d6b; --good2:#6fd39a; --warn:#c98a2e; --bad:#c2453e;
  --chip:#2a2426; --chip-on:#8d1b34; --tell:#d8a13a;
  --radius:14px; --tap:48px;
  --sh:0 2px 10px rgba(0,0,0,.45);
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f6f2f1; --bg2:#efe9e8; --panel:#ffffff; --panel2:#f2ecec; --line:#d8cdcd;
  --line2:#c2b4b4; --txt:#1d1516; --txt2:#4d4041; --txt3:#6d5f60;
  --accent:#8d1b34; --accent2:#a51f3c; --accent-dim:#e8cfd5;
  --good:#1f7a4d; --good2:#12613b; --warn:#8a5c12; --bad:#a32b25;
  --chip:#ece4e4; --chip-on:#8d1b34; --tell:#8a5c12;
  --sh:0 2px 10px rgba(60,40,44,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ff);
  font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.5rem;letter-spacing:.01em}
h2{font-size:1.22rem}
h3{font-size:1.05rem}
a{color:var(--accent2)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================ CHROME ==== */
.appbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-size:1.28rem;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--txt3);font-size:.76rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:1.05rem;cursor:pointer;
}
.iconbtn:active{background:var(--panel2)}
main{padding:14px 12px 24px;max-width:860px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  background:none;border:0;border-radius:12px;padding:6px 2px;min-height:56px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt3);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
}
.tabbar button .ic{font-size:1.25rem;line-height:1}
.tabbar button[aria-current="page"]{color:var(--txt);background:var(--panel)}
.tabbar button[aria-current="page"] .ic{filter:drop-shadow(0 0 6px var(--accent))}

/* ============================================================ BLOCKS ==== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-top:0}
.muted{color:var(--txt2)}
.dim{color:var(--txt3)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stack>*+*{margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{
  min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--txt);cursor:pointer;font-weight:600;letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* chips */
.field{margin:0 0 16px}
.field>.flabel{display:flex;align-items:baseline;gap:8px;margin:0 0 7px;flex-wrap:wrap}
.field>.flabel b{font-size:.96rem;letter-spacing:.02em}
.field .hint{color:var(--txt3);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);
  background:var(--chip);color:var(--txt);cursor:pointer;font-size:.93rem;line-height:1.2;
  display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--accent2);color:#fff;font-weight:600}
.chip.tell{border-color:var(--tell)}
.chip.tell::after{content:"◆";color:var(--tell);font-size:.7em}
.chip[aria-pressed="true"].tell::after{color:#ffe0a8}
.chip.sm{min-height:38px;padding:6px 11px;font-size:.85rem}
.chip.scale{flex:1 1 0;min-width:64px;justify-content:center;border-radius:10px;text-align:center}

/* hue swatches */
.hues{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.hue{
  border:2px solid var(--line2);border-radius:12px;padding:0;cursor:pointer;overflow:hidden;
  background:var(--panel2);display:flex;flex-direction:column;min-height:82px;
}
.hue .sw{flex:1;min-height:46px}
.hue .nm{font-size:.7rem;padding:4px 3px;line-height:1.15;color:var(--txt2);text-align:center}
.hue[aria-pressed="true"]{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-dim)}
.hue[aria-pressed="true"] .nm{color:var(--txt);font-weight:700}

/* collapsible */
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 8px;overflow:hidden}
details.grp>summary{
  cursor:pointer;list-style:none;padding:12px 14px;min-height:48px;display:flex;align-items:center;gap:8px;
  font-weight:600;font-size:.95rem;
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";color:var(--txt3);transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp>summary .cnt{margin-left:auto;font-size:.78rem;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;min-width:24px;text-align:center}
details.grp>summary .cnt[data-n="0"]{background:transparent;color:var(--txt3)}
details.grp .grpbody{padding:0 12px 12px}
/* aroma search — sticks under the app bar so it stays reachable while you
   scroll a long list one-handed */
.asearch{position:sticky;top:var(--appbar-h,60px);z-index:15;background:var(--panel);
  padding:8px 0 10px;margin:0 0 4px;border-bottom:1px solid var(--line)}
.asearch .inp{min-height:46px}
.asearch .srow{display:flex;gap:8px;align-items:center;margin-top:8px}
.asearch .srow .btn{flex:none}
.hitmeta{font-size:.76rem;color:var(--txt3);margin:8px 0 6px}
.picked{border:1px solid var(--line);border-radius:12px;background:var(--panel2);
  padding:10px 12px;margin:0 0 10px}
.picked .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.picked .phead b{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3)}

/* range bars */
.bar{margin:8px 0 12px}
.bar .barlab{display:flex;justify-content:space-between;font-size:.82rem;color:var(--txt2);margin-bottom:4px;gap:8px}
.barseg{display:flex;gap:3px}
.barseg i{
  flex:1;height:16px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);
  position:relative;font-style:normal;
}
.barseg i.in{background:var(--accent-dim);border-color:var(--accent)}
.barseg i.you{box-shadow:inset 0 0 0 2px var(--txt)}
.barseg i.you::after{content:"";position:absolute;inset:3px;border-radius:2px;background:var(--txt)}
.barseg i.you.in::after{background:var(--accent2)}
.barticks{display:flex;gap:3px;margin-top:3px}
.barticks span{flex:1;font-size:.62rem;color:var(--txt3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress + steps */
.steps{display:flex;gap:4px;margin:0 0 12px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.railwrap{position:relative}
.railwrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:26px;
  pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg));opacity:0;
  transition:opacity .15s}
.railwrap.more::after{opacity:1}
.steps button{
  flex:1 0 auto;min-height:40px;padding:0 10px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel);border-radius:10px;
  color:var(--txt3);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-weight:600;
}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
.steps button.done{color:var(--txt);border-color:var(--line2)}
.counter{font-variant-numeric:tabular-nums;color:var(--txt2);font-size:.85rem}
.progress{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}

/* results */
.rank{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:0 0 10px;overflow:hidden}
.rank.top{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
.rank>.rhead{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:left;color:inherit}
.rank .pos{font-size:1.1rem;font-weight:700;color:var(--txt3);min-width:22px}
.rank .nm{flex:1;min-width:0}
.rank .nm b{display:block;font-size:1.02rem}
.rank .nm span{color:var(--txt2);font-size:.85rem}
.rank .cf{text-align:right;font-variant-numeric:tabular-nums}
.rank .cf b{font-size:1.15rem;color:var(--accent2)}
.mbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:0 14px 12px;border:1px solid var(--line)}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rank .rbody{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px}
.ev{margin:10px 0 0;padding:0;list-style:none}
.ev li{display:flex;gap:8px;padding:5px 0;font-size:.9rem;line-height:1.45;border-bottom:1px dashed var(--line)}
.ev li:last-child{border-bottom:0}
.ev .s{color:var(--good2);font-weight:700}
.ev .c{color:var(--bad);font-weight:700}
.disc{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--tell);font-size:.9rem}
.disc b{color:var(--tell)}

/* pitfall cards */
.pit{border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:12px;background:var(--panel2);padding:12px;margin:0 0 10px}
.pit .pm{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.pit .pw{font-weight:700;font-size:1rem;margin:2px 0 8px}
.pit p{margin:0 0 8px;font-size:.91rem;line-height:1.5}
.pit p:last-child{margin-bottom:0}
.pit .sep-by{color:var(--txt);background:var(--panel);border-radius:8px;padding:9px 10px;border:1px solid var(--line)}

/* codex */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:inherit;min-height:96px;display:flex;flex-direction:column;gap:6px}
.wcard:active{background:var(--panel2)}
.wcard b{font-size:1rem;line-height:1.2}
.wcard .sub{font-size:.78rem;color:var(--txt3)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.25)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs button{white-space:nowrap;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);color:var(--txt);cursor:pointer;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.82rem;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.pill.tell{border-color:var(--tell);color:var(--tell);font-weight:600}
.pill.diff{border-color:var(--accent2);color:var(--accent2)}
.difflist{list-style:none;margin:6px 0 0;padding:0}
.difflist li{display:flex;gap:8px;font-size:.88rem;line-height:1.45;padding:6px 0;
  border-bottom:1px dashed var(--line)}
.difflist li:last-child{border-bottom:0}
.difflist li::before{content:"▸";color:var(--accent2);flex:none}
.swrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swrow .s{width:40px;height:28px;border-radius:7px;border:1px solid var(--line2)}
.inp{width:100%;min-height:var(--tap);padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt)}
textarea.inp{padding:10px 14px;min-height:96px;line-height:1.45}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt3) 50%),linear-gradient(135deg,var(--txt3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

/* tables / history */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--txt3);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.logrow{border:1px solid var(--line);border-radius:12px;background:var(--panel2);
  padding:11px 12px;margin:0 0 8px}
.logrow.flagged{border-left:3px solid var(--tell)}
.logrow .lhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.logrow .when{font-size:.74rem;color:var(--txt3);letter-spacing:.03em}
.logline{display:flex;gap:8px;font-size:.88rem;line-height:1.45;padding:3px 0}
.logline b{flex:none;width:34px;color:var(--txt3);font-weight:600;font-size:.74rem;
  letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.logline span{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.notice,.pit p,.logrow,.wcard,.ev li span{overflow-wrap:anywhere}
.logline.hit span{color:var(--good2)}
.logline.miss span{color:var(--bad)}
.logscore{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.logscore b{font-size:1.3rem;line-height:1}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;padding:4px 0}
.spark i{flex:1;min-width:4px;background:var(--accent);border-radius:3px 3px 0 0;display:block}
.score{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--txt2)}
.badge.ok{color:var(--good2);border-color:var(--good)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.peek{color:var(--tell);border-color:var(--tell)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.modal.on{display:flex}
.modal .sheet{background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:11px 16px;border-radius:12px;box-shadow:var(--sh);max-width:90vw;display:none;font-size:.9rem}
#toast.on{display:block;animation:fade .15s}
.notice{border:1px solid var(--warn);color:var(--txt);background:var(--panel2);
  border-radius:10px;padding:9px 11px;font-size:.86rem;margin:0 0 10px;line-height:1.45}
.notice b{color:var(--warn)}
.peekflag{background:var(--accent-dim);border:1px solid var(--accent);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:.85rem;margin-bottom:10px}
.empty{text-align:center;color:var(--txt3);padding:28px 12px;font-size:.92rem}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><b>Blind</b><span id="ctxLabel">deductive tasting</span></div>
  <button class="iconbtn" id="btnTheme" aria-label="Toggle light or dark theme" title="Theme">◐</button>
  <button class="iconbtn" id="btnSettings" aria-label="Settings" title="Settings">⚙</button>
</header>
<main>
  <section id="view-taste" class="view on" aria-label="Taste"></section>
  <section id="view-codex" class="view" aria-label="Codex"></section>
  <section id="view-history" class="view" aria-label="History"></section>
  <section id="view-practice" class="view" aria-label="Practice"></section>
</main>
<nav class="tabbar" aria-label="Sections">
  <button data-view="taste" aria-current="page"><span class="ic" aria-hidden="true">🍷</span>Taste</button>
  <button data-view="codex"><span class="ic" aria-hidden="true">📖</span>Codex</button>
  <button data-view="history"><span class="ic" aria-hidden="true">📈</span>History</button>
  <button data-view="practice"><span class="ic" aria-hidden="true">🎯</span>Practice</button>
</nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet" id="modalSheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ==========================================================================
   BLIND — a deductive blind-tasting trainer.  Single file, no dependencies.
   Layout of this script:
     1. Vocabulary  (scales, hues, aroma taxonomy)      — below
     2. WINE_DB     (the wine data — edit freely)       — search "WINE_DB"
     3. Inference engine                                — search "ENGINE"
     4. State / storage                                 — search "STATE"
     5. UI: taste grid, guess, reveal, codex, history, practice
   ======================================================================== */

/* ---------------------------------------------------------------- utils */
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function uniq(a){return Array.from(new Set(a));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function $(id){return document.getElementById(id);}
function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
function listSentence(a){a=a.filter(Boolean);if(a.length<2)return a[0]||'';if(a.length===2)return a[0]+' and '+a[1];return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}

/* ============================================================ 1. VOCAB == */
/* Ordinal scales. Stored values are 1-based indices into these arrays, so a

var AROMA={},AROMA_LIST=[],TELLS={};
AROMA_GROUPS.forEach(function(g){

var CLARITY=[['clear','clear'],['hazy','hazy']];

var BUBBLES=[['none','none'],['petillance','pétillance'],
  ['fine-sediment','fine sediment'],['heavy-sediment','heavy sediment']];

/* ---- one place that knows how to name a field and format its value ---- */
var FIELD_LABEL={
  wineType:'Wine type',clarity:'Clarity',concentration:'Concentration',hue:'Hue',
  rim:'Rim variation',legs:'Tears / legs',gumStain:'Gum staining',bubbles:'Bubbles & sediment',

  balance:'Balance',finishesOn:'Finishes on',quality:'Perceived quality',
  world:'Old / New World',climate:'Climate',vintage:'Vintage range',winemaking:'Winemaking'
};
var FIELD_SCALE={concentration:'concentration',noseIntensity:'intensity',
  flavorIntensity:'intensity',sweetness:'sweetness',acidity:'acidity',tannin:'tannin',
  alcohol:'alcohol',body:'body',finish:'finish'};
var FIELD_OPTS={wineType:WINE_TYPES,clarity:CLARITY,rim:RIM,legs:LEGS,gumStain:GUMSTAIN,
  bubbles:BUBBLES,balance:BALANCE,finishesOn:FINISH_ON,quality:QUALITY,world:WORLDS,
  climate:CLIMATES,vintage:VINTAGES,winemaking:WINEMAKING,palateOnly:PALATE_ONLY};
function optLabel(table,val){
  for(var i=0;i<table.length;i++)if(table[i][0]===val)return table[i][1];
  return String(val);
}
function fieldLabel(k){return FIELD_LABEL[k]||k;}
function fieldValueText(k,v){
  if(v==null||v==='')return '';
  if(k==='aromas'||k==='palateConfirm')
    return Object.keys(v).filter(function(x){return v[x];}).map(aromaLabel).join(', ');
  if(k==='hue')return HUE_INDEX[v]?HUE_INDEX[v].name:String(v);
  if(FIELD_SCALE[k]&&typeof v==='number')return scaleLabel(FIELD_SCALE[k],v);
  var tbl=FIELD_OPTS[k];
  /* the field's own table wins: 'lees' and 'oxidative' are both winemaking
     ids AND aroma ids, and were playing back with the aroma label      */
  if(Array.isArray(v))return v.map(function(x){
    if(tbl)return optLabel(tbl,x);
    if(AROMA[x])return aromaLabel(x);
    return String(x);}).join(', ');
  if(tbl)return optLabel(tbl,v);
  return String(v);
}

<script>
"use strict";
/* ============================================ CROSS-CUTTING PITFALLS ==== */
var CROSS_PITFALLS=[
 {id:'winemaking',title:'Winemaking wearing the varietal’s clothes',
  body:[
   ['Carbonic maceration','Banana, bubble gum, pear drop and a candied violet lift. It is a fermentation signature, not a grape. It appears in Beaujolais, in carbonic Syrah, Pinot and Mencía, and increasingly anywhere. If the wine smells of banana, ask what was done to it before asking what it is.'],
   ['Whole-cluster / stems','Green peppercorn, dried herb, a tea-like grip and a stalky lift on the finish. Easy to read as pyrazine (and therefore as Cabernet Franc or Carménère) when it is actually stem inclusion in Pinot, Syrah or Grenache. Stem green sits on the finish; pyrazine green sits on the nose.'],
   ['Heavy new oak','Vanilla, toast, mocha, coconut, sweet baking spice, and a sweetening of the mid-palate. French oak leans cedar-mocha-toast; American oak leans coconut-dill-vanilla. Neither is a varietal tell, and modern producers everywhere use both. Strip the oak out in your head before you call the grape.'],
   ['Extended lees / sur lie','Bread dough, brioche, yoghurt and a creamy texture that mimics body and ripeness. It can make a 12% Muscadet feel like a 13.5% Chardonnay. Texture from lees is broad but not warm: the finish still comes back cool and acidic.'],
   ['Reduction / struck match','Flint, gunflint, struck match, sometimes rubber or cabbage. Deliberate in much modern white Burgundy, Yarra Chardonnay and Loire Sauvignon. Tasters call it "minerality" and then call the wine Chablis. It blows off with air; true stone minerality does not.'],
   ['Brett','Band-aid, barnyard, horse, clove, smoked meat. It reads as "Old World rusticity" and pushes tasters toward the southern Rhône or Bandol when the wine may be Californian. Brett is a microbe, not a place.'],
   ['Volatile acidity','Nail polish, acetone, a sweet-sharp lift at the top of the nose. In small amounts it raises aromatic intensity and makes a wine smell riper and more "New World" than it is.'],
   ['Oxidative handling','Bruised apple, nuts, dried fruit, a burnished gold colour. It ages a wine visually and aromatically. A five-year-old oxidative white can read as a twenty-year-old reductive one.']]},
 {id:'age-climate',title:'Age impersonating climate (and the reverse)',
  body:[
   ['Tertiary read as warmth','Dried fruit, leather, fig and honey come from time in bottle as readily as from sunshine. A ten-year-old Chianti shows dried cherry; so does a young Californian Zinfandel. Check alcohol and acid: age lowers neither, ripeness raises one and lowers the other.'],
   ['Underripeness read as age','Underripe fruit is tart, thin and herbal — which can read as a wine that has dried out. The colour decides it: a young underripe red keeps a purple rim, a genuinely old red does not.'],
   ['Colour is a compound signal','Red wines lose colour and gain brown with age; white wines gain colour. But oxidative handling, low-SO2 winemaking, skin contact and warm-climate ripeness all shift colour too. Never treat colour as an age reading on its own.'],
   ['Alcohol does not age','If the wine is 14.5%, it was 14.5% at bottling. Alcohol is the one structural reading that time cannot fake, which makes it one of your most reliable anchors.']]},
 {id:'ow-nw',title:'Old World / New World markers that lie',
  body:[
   ['Alcohol','Once a reliable hemisphere tell, now useless on its own. Châteauneuf runs 15%; Sonoma Coast Pinot and Yarra Chardonnay run 12.5–13%. Warm European vintages routinely out-ripen cool New World sites.'],
   ['Oak regimes have converged','French oak is standard in Napa, Mendoza and Marlborough; Bordeaux and Rioja use it too. The presence of expensive oak tells you about the budget, not the border.'],
   ['Earth versus fruit','"Old World is earthy, New World is fruity" fails immediately against Washington Syrah, Sonoma Coast Pinot, Swartland Chenin, and against fruit-forward modern Rioja or Chianti. Use specific markers — pyrazine, slate, garrigue, volcanic ash — not a vibe.'],
   ['What does still travel','Acid retention and picking decisions. Old World benchmarks tend to pick earlier relative to their site. But the gap is now a tendency, not a rule: commit to a grape on the grape’s evidence, then let world and climate follow from it.']]},
 {id:'service',title:'Temperature, glass and the physics of your read',
  body:[
   ['Too cold','Suppresses aroma, exaggerates acid and tannin, mutes alcohol and sweetness. A cold Chardonnay reads as leaner and higher-acid than it is; a cold red reads as more tannic and angular.'],
   ['Too warm','Inflates perceived alcohol and body, softens acid, blurs aromatics into a general sweetness. A warm Pinot can read as Grenache.'],
   ['Glass shape','Narrow glasses concentrate volatile alcohol and reduce perceived fruit. A tasting-room ISO glass gives a different read to a large Burgundy bowl, particularly on aromatic intensity.'],
   ['Time in glass','Reduction blows off in minutes; primary fruit fades over an hour. Re-nose the wine before the final call — many wines that start "mineral" end up simply reduced.'],
   ['Your own palate','Sequence matters. Anything after a high-tannin red reads as soft; anything after a searing white reads as flat. Re-taste across a flight, not in order.']]},
 {id:'anchoring',title:'Anchoring: how an early call corrupts everything after it',
  body:[
   ['The mechanism','Once you say "deep purple, so probably Syrah" out loud, every subsequent observation gets bent toward Syrah. You find pepper because you are looking for pepper. This is the single largest source of error in deductive tasting, and it is not fixed by knowing more about wine.'],
   ['Record before you interpret','Write down what is in the glass — colour, intensity, structure — before you name a candidate. This app deliberately keeps the deduction hidden until you commit your own guess, for the same reason.'],
   ['Treat the palate as the veto','Aroma is suggestive; structure is evidential. Acid, tannin, alcohol and body are far harder to fake and far harder to mis-read. When nose and palate disagree, the palate usually wins.'],

   ['Beware the flight','If you know three of the six wines in a flight, you will unconsciously make the fourth fit the gap. Score each glass as if it arrived alone.']]}

/* ====================================== DB NORMALISATION & VALIDATION === */
function normMarkers(list){
  return (list||[]).map(function(m){
    if(Array.isArray(m))return {note:m[0],w:m[1]||1,ageGated:m[2]||0};
    return {note:m.note,w:m.w||1,ageGated:m.ageGated||0};
  });
}
/* Two structural vetoes on the same scale (say concentration>=5 and >=6)
   would stack their multiplicative penalties. Keep only the broadest.   */
function dedupeVetoes(list){
  var out=[],seen={},struct={};
  uniq(list).forEach(function(v){
    var m=/^(\w+)(>=|<=)([1-6])$/.exec(v);
    if(!m){if(!seen[v]){seen[v]=1;out.push(v);}return;}
    var k=m[1]+m[2],n=+m[3];
    if(struct[k]==null)struct[k]=n;
    else struct[k]=(m[2]==='>=')?Math.min(struct[k],n):Math.max(struct[k],n);
  });
  Object.keys(struct).forEach(function(k){out.push(k+struct[k]);});
  return out;
}
function mergeMarkers(base,extra){
  var out={},order=[];
  base.concat(extra).forEach(function(m){if(!out[m.note])order.push(m.note);out[m.note]=m;});
  return order.map(function(n){return out[n];});
}
var GRAPES={},CANDIDATES=[],CAND_BY_ID={};
(function buildIndex(){
  WINE_DB.forEach(function(g){
    g.markerObjs=normMarkers(g.markers);
    g.confusedWith=uniq((g.pitfalls||[]).map(function(p){return p.with;})
      .filter(function(x){return x&&x!==g.id;}).concat(g.alsoConfused||[]));
    GRAPES[g.id]=g;
    (g.regions||[]).forEach(function(r){
      var c={
        id:g.id+'::'+r.id,grapeId:g.id,grape:g.grape,aka:g.aka,color:g.color,
        regionId:r.id,region:r.name,place:r.place||r.name,country:r.country,
        world:r.world,climate:r.climate,flight:!!(r.flight||g.flight),
        identity:r.identity||g.identity,
        ranges:Object.assign({},g.ranges,r.ranges||{}),
        hues:r.hues||g.hues||[],
        markers:mergeMarkers(g.markerObjs,normMarkers(r.markers)),
        vetoes:dedupeVetoes((g.vetoes||[]).concat(r.vetoes||[]))
          .filter(function(v){return (r.unveto||[]).indexOf(v)<0;}),
        winemaking:r.winemaking||[],
        texture:r.texture||g.texture||[],
        producers:r.producers||g.producers||[],
        diffs:r.diffs||[],
        tells:g.tells||[]
      };
      c.markerMap={};c.markers.forEach(function(m){c.markerMap[m.note]=m;});
      CANDIDATES.push(c);CAND_BY_ID[c.id]=c;
    });
  });
})();
function grapeOf(id){return GRAPES[id];}
function candName(c){return c.grape+' — '+c.region;}

/* Self-check. Runs on boot in dev; exposed for tests. */
function validateDB(){
  var errs=[],warns=[];
  WINE_DB.forEach(function(g){
    if(!g.regions||!g.regions.length)errs.push(g.id+': no regions');
    if((g.pitfalls||[]).length<2)errs.push(g.id+': fewer than two pitfall cards');
    (g.pitfalls||[]).forEach(function(p){
      if(!GRAPES[p.with])errs.push(g.id+': pitfall refers to unknown entry "'+p.with+'"');
      if(!p.why||!p.sep)errs.push(g.id+': pitfall '+p.with+' missing why/sep');
    });
    (g.confusedWith||[]).forEach(function(w){if(!GRAPES[w])errs.push(g.id+': confusedWith "'+w+'" unresolved');});
    if(!g.aging)warns.push(g.id+': no ageing notes');
  });
  CANDIDATES.forEach(function(c){
    c.markers.forEach(function(m){if(!AROMA[m.note])errs.push(c.id+': unknown marker "'+m.note+'"');});
    c.hues.forEach(function(h){
      if(!HUE_INDEX[h])errs.push(c.id+': unknown hue "'+h+'"');
      else if(HUE_INDEX[h].fam!==c.color&&!(c.color==='white'&&HUE_INDEX[h].fam==='rose'))
        warns.push(c.id+': hue "'+h+'" is not in the '+c.color+' family');
    });
    c.vetoes.forEach(function(v){
      if(AROMA[v]||HUE_INDEX[v])return;
      if(/^(concentration|acidity|tannin|alcohol|body|sweetness|finish)(>=|<=)[1-6]$/.test(v))return;
      errs.push(c.id+': unparseable veto "'+v+'"');
    });
    ['concentration','acidity','tannin','alcohol','body','sweetness','finish'].forEach(function(k){
      var r=c.ranges[k];if(!r)return;
      if(!SCALES[k])return errs.push(c.id+': range on unknown scale '+k);
      if(r[0]<1||r[1]>SCALES[k].length||r[0]>r[1])errs.push(c.id+': bad range '+k+' ['+r+']');
    });
    if(c.color==='white'&&c.ranges.tannin)warns.push(c.id+': white with a tannin range');
  });
  return {errors:errs,warnings:warns,grapes:WINE_DB.length,candidates:CANDIDATES.length};
}
</script>
<script>
"use strict";
/* ================================================ 3. ENGINE ============== */
/* Weights for each structural scale. A scale the taster skipped is absent
   from BOTH the numerator and the denominator — it cannot help or hurt.  */
/* No candidate declares an `intensity` range, so aromatic and flavour
   intensity are recorded for the taster's own notes but carry no weight
   here — and must not inflate the confidence ceiling either (see
   EVIDENCE_FREE below).                                               */
var STRUCT_W={concentration:1.2,acidity:1.5,tannin:1.5,alcohol:1.2,body:1.0,sweetness:1.3,finish:0.6};
var EVIDENCE_FREE=['noseIntensity','flavorIntensity','clarity','legs','gumStain','bubbles',
  'rim','balance','finishesOn','quality'];
var HUE_W=1.4, TELL_MISS_W=1.3, WORLD_W=0.7, CLIMATE_W=0.7, WM_W=0.5;
var CLIMATE_ORD={cool:1,moderate:2,warm:3};

/* distance -> value in [-1,1] */
function bandValue(d){return d===0?1:d===1?0.25:d===2?-0.5:-1;}
function distToRange(v,r){return v<r[0]?r[0]-v:v>r[1]?v-r[1]:0;}
function rangeWords(k,r){
  return r[0]===r[1]?scaleLabel(k,r[0]):scaleLabel(k,r[0])+' to '+scaleLabel(k,r[1]);
}
function obsAromaSet(obs){
  var s={};
  Object.keys(obs.aromas||{}).forEach(function(k){if(obs.aromas[k])s[k]=true;});
  Object.keys(obs.palateConfirm||{}).forEach(function(k){if(obs.palateConfirm[k])s[k]=true;});
  /* fruit condition lives in its own field but is evidence like any other */
  (obs.condition||[]).forEach(function(k){s[k]=true;});
  return s;
}
function countObservations(obs){
  var n=0;
  ['wineType','clarity','concentration','hue','rim','legs','gumStain','bubbles','noseIntensity',
   'sweetness','acidity','tannin','alcohol','body','flavorIntensity','finish','balance','finishesOn',
   'quality','world','climate','vintage'].forEach(function(k){if(obs[k]!=null&&obs[k]!=='')n++;});
  n+=Object.keys(obsAromaSet(obs)).length;
  ['tanninTexture','mouthfeel','palateOnly','winemaking','condition'].forEach(function(k){
    n+=((obs[k]||[]).length?1:0);});
  return n;
}
function vetoHit(v,obs,ctx){
  if(HUE_INDEX[v])return obs.hue===v;
  if(AROMA[v])return !!ctx.aromas[v];
  var m=/^(\w+)(>=|<=)([1-6])$/.exec(v);
  if(!m)return false;
  var val=obs[m[1]];if(val==null)return false;
  return m[2]==='>='?val>=+m[3]:val<=+m[3];
}
function vetoWords(v){
  if(HUE_INDEX[v])return 'a '+HUE_INDEX[v].name+' colour';
  if(AROMA[v])return aromaLabel(v).toLowerCase();
  var m=/^(\w+)(>=|<=)([1-6])$/.exec(v);
  return m?(scaleLabel(m[1],+m[3])+' or '+(m[2]==='>='?'higher':'lower')+' '+m[1]):v;
}

function scoreCandidate(c,obs,ctx){
  if(obs.wineType&&c.color!==obs.wineType)return null;
  var score=0,weight=0,sup=[],con=[],hitW=0,tellHits=0;
  function add(val,w,text,detail){
    score+=val*w;weight+=w;
    if(val>=0.9&&w>=0.6)sup.push({w:w*val,t:text});
    else if(val<=-0.25)con.push({w:w*-val,t:detail||text});
  }
  /* ---- structural scales ---------------------------------------------- */
  Object.keys(STRUCT_W).forEach(function(k){
    var v=obs[k],r=c.ranges[k];
    if(v==null||!r)return;
    if(k==='tannin'&&c.color!=='red'&&c.color!=='fortified')return; /* never reason about tannin on a white */
    var d=distToRange(v,r),val=bandValue(d),w=STRUCT_W[k];
    /* A narrow prediction that comes true is worth more than a wide one. */
    if(d===0){var len=SCALES[k]?SCALES[k].length:6;
      score+=0.4*w*(1-(r[1]-r[0])/(len-1));}
    add(val,w,
      scaleLabel(k,v)+' '+k+' sits inside '+c.region+'’s expected band ('+rangeWords(k,r)+')',
      'you called '+scaleLabel(k,v)+' '+k+'; '+c.grape+' from '+c.region+' is typically '+rangeWords(k,r));
  });
  /* ---- colour / hue ---------------------------------------------------- */
  if(obs.hue&&c.hues.length){
    var oh=HUE_INDEX[obs.hue],val,d=null;
    if(c.hues.indexOf(obs.hue)>=0)val=1;
    else{
      var idxs=c.hues.map(function(h){return HUE_INDEX[h]&&HUE_INDEX[h].fam===(oh&&oh.fam)?HUE_INDEX[h].i:null;})
        .filter(function(x){return x!=null;});
      if(!idxs.length)val=-1;
      else{d=Math.min.apply(null,idxs.map(function(i){return Math.abs(i-oh.i);}));
           val=d===1?0.2:d===2?-0.4:-1;}
    }
    var hueNames=c.hues.map(function(h){return HUE_INDEX[h]?HUE_INDEX[h].name:h;});
    add(val,HUE_W,
      'the '+(oh?oh.name:obs.hue)+' hue is textbook for '+c.region,
      'you called the colour '+(oh?oh.name:obs.hue)+'; '+c.region+' runs '+listSentence(hueNames));
  }
  /* ---- aroma markers --------------------------------------------------- */
  var vintYears=obs.vintage?VINTAGE_MID[obs.vintage]:null;
  c.markers.forEach(function(m){
    if(!ctx.aromas[m.note])return;
    var w=m.w,val=1,note='';
    if(m.ageGated&&vintYears!=null&&vintYears<m.ageGated){
      val=0.5;w=w*0.5;note=' (though it usually needs '+m.ageGated+'+ years)';
    }
    if(val===1){hitW+=m.w;if(TELLS[m.note]||m.w>=3)tellHits++;}
    score+=val*w;weight+=w;
    sup.push({w:w*val+(TELLS[m.note]?0.4:0),
      t:aromaLabel(m.note)+(m.w>=3?' — a diagnostic marker for ':' — a typical marker of ')+c.region+note});
  });
  /* ---- diagnostic tells the taster found that this wine does not show -- */
  Object.keys(ctx.tellsFound).forEach(function(t){
    if(c.markerMap[t])return;
    score+=-1*TELL_MISS_W;weight+=TELL_MISS_W;
    con.push({w:TELL_MISS_W*1.1,t:'you found '+aromaLabel(t).toLowerCase()+', which '+c.grape+' does not normally show'});
  });
  /* ---- conclusion inputs ---------------------------------------------- */
  if(obs.world&&c.world)add(obs.world===c.world?1:-1,WORLD_W,
    'an Old/New World read of '+(obs.world==='old'?'Old':'New')+' World matches '+c.country,
    'you read the wine as '+(obs.world==='old'?'Old':'New')+' World; '+c.region+' is '+(c.world==='old'?'Old':'New')+' World');
  if(obs.climate&&c.climate){
    var cd=Math.abs(CLIMATE_ORD[obs.climate]-CLIMATE_ORD[c.climate]);
    add(bandValue(cd),CLIMATE_W,
      'a '+obs.climate+'-climate read matches '+c.region,
      'you read the climate as '+obs.climate+'; '+c.region+' is '+c.climate);
  }
  (obs.winemaking||[]).forEach(function(s){
    if(!c.winemaking.length)return;
    var lab=(WINEMAKING.filter(function(x){return x[0]===s;})[0]||[s,s])[1];
    add(c.winemaking.indexOf(s)>=0?1:-0.6,WM_W,
      lab.toLowerCase()+' is standard practice in '+c.region,
      'you read '+lab.toLowerCase()+'; that is unusual for '+c.region);
  });
  /* ---- assemble -------------------------------------------------------- */
  /* Coverage damping: a three-observation grid cannot produce a high match,
     however well those three observations happen to fit.                */
  var cover=weight/(weight+4);
  var base=weight>0?(score/weight)*cover:0;
  var bonus=(2.0*hitW+3*tellHits)*cover;
  /* Squash rather than clamp: a hard 0-100 clip flattens every strong
     candidate onto 100 and destroys the ranking between them.           */
  var raw=42*base+bonus;
  var match=100/(1+Math.exp(-(raw-20)/14));
  var vetoes=c.vetoes.filter(function(v){return vetoHit(v,obs,ctx);});
  vetoes.forEach(function(v){
    con.push({w:6,t:vetoWords(v)+' argues hard against '+c.grape+' from '+c.region});
  });
  match=match*Math.pow(0.45,vetoes.length);
  sup.sort(function(a,b){return b.w-a.w;});con.sort(function(a,b){return b.w-a.w;});
  return {cand:c,match:match,base:base,weight:weight,hitW:hitW,tellHits:tellHits,
    vetoes:vetoes,support:sup.slice(0,6),contra:con.slice(0,5)};
}

/* Pitfall separations often open with a short framing line ("Tomato versus
   tar.", "Feel the shape.") and put the actual instruction second. Take
   enough sentences to carry the information, not just the first. */
function leadSentences(txt){
  var parts=String(txt||'').split('. '),out='';
  for(var i=0;i<parts.length;i++){
    out+=(out?'. ':'')+parts[i];
    if(out.length>=70||i>=1)break;
  }
  return out.replace(/\.\s*$/,'')+'.';
}
/* One line telling the taster what separates two candidates. */
function discriminator(a,b){
  if(!a||!b)return '';
  if(a.cand.grapeId===b.cand.grapeId){
    var d=(b.cand.diffs||[])[0]||(a.cand.diffs||[])[0];
    return 'Same grape, different address: '+(d?d.charAt(0).toLowerCase()+d.slice(1):
      a.cand.region+' and '+b.cand.region+' differ mostly in ripeness and oak')+'.';
  }
  var g=grapeOf(a.cand.grapeId),p=(g.pitfalls||[]).filter(function(x){return x.with===b.cand.grapeId;})[0];
  if(!p){var g2=grapeOf(b.cand.grapeId);
    p=(g2.pitfalls||[]).filter(function(x){return x.with===a.cand.grapeId;})[0];}
  if(p)return leadSentences(p.sep);
  /* computed fallback: strongest marker one has and the other lacks */
  var mk=a.cand.markers.filter(function(m){return m.w>=2&&!b.cand.markerMap[m.note];})
    .sort(function(x,y){return y.w-x.w;})[0];
  if(mk)return 'Look for '+aromaLabel(mk.note).toLowerCase()+': '+a.cand.grape+' shows it, '+b.cand.grape+' does not.';
  var keys=['tannin','acidity','concentration','alcohol','body'];
  for(var i=0;i<keys.length;i++){
    var k=keys[i],ra=a.cand.ranges[k],rb=b.cand.ranges[k];
    if(ra&&rb&&(ra[1]<rb[0]||rb[1]<ra[0]))
      return 'Re-check '+k+': '+a.cand.grape+' runs '+rangeWords(k,ra)+', '+b.cand.grape+' runs '+rangeWords(k,rb)+'.';
  }
  return 'Re-taste side by side and trust the structure over the aromatics.';
}

/* Full ranking. Returns {ranked, confidence-bearing top 5, field mass}. */
function runInference(obs,opts){
  opts=opts||{};
  var ctx={aromas:obsAromaSet(obs),tellsFound:{}};
  Object.keys(ctx.aromas).forEach(function(a){if(TELLS[a])ctx.tellsFound[a]=true;});
  var pool=CANDIDATES.filter(function(c){
    if(opts.onlyCore&&CORE_TYPES.indexOf(c.color)<0)return false;
    return true;});
  var scored=[];
  pool.forEach(function(c){var s=scoreCandidate(c,obs,ctx);if(s)scored.push(s);});
  scored.sort(function(a,b){return b.match-a.match;});
  if(!scored.length)return {top:[],all:[],grapeRank:[],obsCount:countObservations(obs),
    tellsFound:Object.keys(ctx.tellsFound).length,fieldMass:0,remaining:100,cap:0,
    emptyPool:obs.wineType||null};

  var obsCount=countObservations(obs);
  var tellsFound=Object.keys(ctx.tellsFound).length;
  var T=6,topMatch=scored[0].match,total=0;
  scored.forEach(function(s){s._w=Math.exp((s.match-topMatch)/T);total+=s._w;});
  var share=scored.map(function(s){return s._w/total;});
  /* Evidence ceiling: high confidence has to be earned. Above ~85% needs
     both a well-filled grid and several diagnostic markers.             */
  var diag=Math.max(tellsFound,scored[0].tellHits);
  /* count only what the engine actually weighed */
  var evidenceCount=obsCount;
  EVIDENCE_FREE.forEach(function(k){if(obs[k]!=null&&obs[k]!=='')evidenceCount--;});
  var cap=0.42+0.02*Math.min(Math.max(evidenceCount,0),12)+0.05*Math.min(diag,5);
  var scale=share[0]>cap?cap/share[0]:1;
  scored.forEach(function(s,i){s.confidence=share[i]*scale*100;});

  /* Per-grape aggregate — "it is Nebbiolo, the village is the open
     question" is more honest than four near-identical rows.
     Aggregate on each grape's BEST address, not the sum of its addresses:
     a grape's villages are near-duplicates of one another, so summing
     them would simply reward whichever grape has the most entries.     */
  var byGrape={},gOrder=[];
  scored.forEach(function(s){
    var k=s.cand.grapeId;
    if(!byGrape[k]){byGrape[k]={grapeId:k,grape:s.cand.grape,best:0,confidence:0,regions:[]};gOrder.push(k);}
    if(s._w>byGrape[k].best)byGrape[k].best=s._w;
    if(byGrape[k].regions.length<6)byGrape[k].regions.push(s);
  });
  var gTotal=gOrder.reduce(function(a,k){return a+byGrape[k].best;},0)||1;
  var gShares=gOrder.map(function(k){return byGrape[k].best/gTotal;});
  var gTop=Math.max.apply(null,gShares);
  var gScale=gTop>cap?cap/gTop:1;
  gOrder.forEach(function(k,i){byGrape[k].confidence=gShares[i]*gScale*100;});
  var grapeRank=gOrder.map(function(k){return byGrape[k];})
    .sort(function(a,b){return b.confidence-a.confidence;});

  /* Diverse top five: at most two addresses per grape, so genuine rivals
     are not crowded out by a grape's own villages.                      */
  var perGrape={},top=[];
  for(var i=0;i<scored.length&&top.length<5;i++){
    var gid=scored[i].cand.grapeId;
    perGrape[gid]=(perGrape[gid]||0)+1;
    if(perGrape[gid]<=2)top.push(scored[i]);
  }
  top.forEach(function(s,i){
    s.rank=i+1;
    s.siblings=byGrape[s.cand.grapeId].regions.filter(function(x){return x!==s;}).slice(0,4);
    s.grapeConfidence=byGrape[s.cand.grapeId].confidence;
    s.discriminator=i===0?discriminator(top[0],top[1]):discriminator(top[0],s);
  });
  var mass=top.reduce(function(a,s){return a+s.confidence;},0);
  return {top:top,all:scored,grapeRank:grapeRank,obsCount:obsCount,tellsFound:tellsFound,
    fieldMass:mass,remaining:Math.max(0,100-mass),cap:cap*100};
}

/* ------------------------------------------------- scoring the taster --- */
function scoreGuess(guess,actualId){
  /* guess: {candId, vintage}  actual: candidate id */
  if(!guess||!guess.candId||!actualId)return null;
  var g=CAND_BY_ID[guess.candId],a=CAND_BY_ID[actualId];
  if(!g||!a)return null;
  var parts=[],score=0;
  var grapeRight=g.grapeId===a.grapeId;
  var neighbour=!grapeRight&&(grapeOf(a.grapeId).confusedWith||[]).indexOf(g.grapeId)>=0;
  var neighbour2=!grapeRight&&!neighbour&&(grapeOf(g.grapeId).confusedWith||[]).indexOf(a.grapeId)>=0;
  if(grapeRight){score+=50;parts.push({k:'Grape',pts:50,max:50,note:a.grape+' — correct.'});}
  else if(neighbour||neighbour2){score+=25;parts.push({k:'Grape',pts:25,max:50,
    note:'Close — '+g.grape+' is a documented confusion with '+a.grape+'.'});}
  else parts.push({k:'Grape',pts:0,max:50,note:'You said '+g.grape+'; it was '+a.grape+'.'});

  if(grapeRight&&g.regionId===a.regionId)
    {score+=25;parts.push({k:'Region',pts:25,max:25,note:a.region+' — correct.'});}
  else if(grapeRight&&g.country===a.country)
    {score+=12;parts.push({k:'Region',pts:12,max:25,note:'Right country, wrong address: '+g.region+' vs '+a.region+'.'});}
  else if(g.country===a.country)
    {score+=5;parts.push({k:'Region',pts:5,max:25,note:'Right country ('+a.country+'), wrong grape.'});}
  else parts.push({k:'Region',pts:0,max:25,note:'You said '+g.place+'; it was '+a.place+'.'});

  var vi=VINTAGES.map(function(v){return v[0];});
  if(guess.vintage&&guess.actualVintage){
    var d=Math.abs(vi.indexOf(guess.vintage)-vi.indexOf(guess.actualVintage));
    if(d===0){score+=25;parts.push({k:'Vintage',pts:25,max:25,note:'Bang on the bracket.'});}
    else if(d===1){score+=12;parts.push({k:'Vintage',pts:12,max:25,note:'One bracket out.'});}
    else parts.push({k:'Vintage',pts:0,max:25,note:'More than one bracket out.'});
  } else parts.push({k:'Vintage',pts:0,max:0,note:'Not scored — no vintage entered.'});

  var max=parts.reduce(function(a,p){return a+p.max;},0)||1;
  var pct=Math.round(score/max*100);
  var verdict=pct>=90?'Nailed it. That is a professional-level call.':
    pct>=70?'Strong. The grape is right and the reasoning held up.':
    pct>=45?'Half-right — you were in the correct neighbourhood.':
    pct>=20?'Off, but on a documented confusion. Read the pitfall card.':
    'Missed. Work back through the grid and find where the structure disagreed.';
  var disc='';
  if(!grapeRight){
    var pf=(grapeOf(a.grapeId).pitfalls||[]).filter(function(p){return p.with===g.grapeId;})[0]||
           (grapeOf(g.grapeId).pitfalls||[]).filter(function(p){return p.with===a.grapeId;})[0];
    if(pf)disc=pf.sep;
  }
  return {score:score,max:max,pct:pct,parts:parts,verdict:verdict,discriminator:disc,
    grapeRight:grapeRight,neighbour:neighbour||neighbour2,guess:g,actual:a};
}
if(typeof module!=='undefined'&&module.exports)module.exports={
  WINE_DB:WINE_DB,CANDIDATES:CANDIDATES,CAND_BY_ID:CAND_BY_ID,GRAPES:GRAPES,AROMA:AROMA,
  runInference:runInference,validateDB:validateDB,scoreGuess:scoreGuess,SCALES:SCALES,HUES:HUES};
</script>
<script>
"use strict";
/* ================================================ 4. STATE ============== */
var LS_KEY='blind.v1';
var storage=(function(){
  var ok=false;
  try{var t='__blind_t';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);ok=true;}
  catch(e){ok=false;}
  var mem={};
  return {
    available:ok,
    get:function(k){try{return ok?window.localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;}},
    set:function(k,v){try{if(ok)window.localStorage.setItem(k,v);else mem[k]=v;}catch(e){mem[k]=v;}},
  };
})();
var S={
  theme:'dark',
  settings:{extraTypes:false,tanninOnWhites:false,showTells:true,matchThreshold:80},
  session:null,
  history:[],
  view:'taste',
  codex:{grapeId:null,regionId:null,q:'',color:'',country:'',flight:false,body:''},
  logFilter:'all',
  practice:null
};
function saveState(){
  try{
    storage.set(LS_KEY,JSON.stringify({
      theme:S.theme,settings:S.settings,session:S.session,history:S.history.slice(-400)}));
  }catch(e){/* quota or serialisation — the app keeps working in memory */}
}
function loadState(){
  var raw=storage.get(LS_KEY);if(!raw)return;
  try{
    var o=JSON.parse(raw);
    if(o.theme)S.theme=o.theme;
    if(o.settings)S.settings=Object.assign(S.settings,o.settings);
    if(Array.isArray(o.history))S.history=o.history;
    if(o.session&&validSession(o.session))S.session=o.session;
  }catch(e){/* corrupt payload — start clean rather than crash */}
}
/* A restored session has to be shaped like one. Anything else is
   discarded rather than allowed to throw on every render. */
function validSession(o){
  if(!o||typeof o!=='object')return false;
  if(typeof o.id!=='string'||typeof o.step!=='number')return false;
  if(!(o.step>=0&&o.step<=5))return false;
  if(!o.obs||typeof o.obs!=='object')return false;
  if(o.step===5&&!(o.result&&o.result.top))return false;
  return true;
}
function newSession(mode,practiceWine){
  S.session={id:'s'+Date.now().toString(36),mode:mode||'blind',started:Date.now(),
    step:0,obs:{aromas:{},palateConfirm:{}},guess:null,result:null,actual:null,
    actualVintage:null,peeked:false,practiceWine:practiceWine||null,
    flashcard:false,note:'',scored:null,pendingActual:null,pendingVintage:null};
  saveState();return S.session;
}
function sess(){if(!S.session)newSession('blind');return S.session;}

/* ----------------------------------------------------------- shell ----- */
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);}
function toast(msg,ms){
  var t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},ms||2200);
}
var _modalPrevFocus=null;
function openModal(title,build){
  var m=$('modal'),sh=$('modalSheet');
  sh.innerHTML='';
  var head=el('div','spread');
  var h=el('h2',null,title);h.id='modalTitle';h.style.margin='0';
  var x=el('button','iconbtn','✕');x.setAttribute('aria-label','Close');
  x.onclick=closeModal;head.appendChild(h);head.appendChild(x);
  sh.appendChild(head);sh.appendChild(el('hr','sep'));
  build(sh);
  _modalPrevFocus=document.activeElement;
  m.classList.add('on');x.focus();
}
function closeModal(){
  $('modal').classList.remove('on');
  if(_modalPrevFocus&&_modalPrevFocus.focus)_modalPrevFocus.focus();
}
function setView(v,opts){
  S.view=v;
  ['taste','codex','history','practice'].forEach(function(n){
    var sec=$('view-'+n);if(sec)sec.classList.toggle('on',n===v);});
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(b){
    if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(v==='taste')renderTaste();
  if(v==='codex')renderCodex(opts);
  if(v==='history')renderHistory();
  if(v==='practice')renderPractice();
  window.scrollTo(0,0);
}

/* ------------------------------------------------- generic UI helpers -- */
function chip(label,on,onclick,extraCls){
  var b=el('button','chip'+(extraCls?' '+extraCls:''),label);
  b.type='button';b.setAttribute('aria-pressed',on?'true':'false');
  b.onclick=function(){onclick();};
  return b;
}
function fieldBox(label,hint){
  var f=el('div','field'),l=el('div','flabel');
  l.appendChild(el('b',null,label));
  if(hint)l.appendChild(el('span','hint',hint));
  f.appendChild(l);return f;
}
function chipRow(){var r=el('div','chips');return r;}
/* single-select; tapping the active chip clears it (every field is skippable) */
function singleField(parent,label,hint,key,opts,after){
  var o=sess().obs,f=fieldBox(label,hint),row=chipRow();
  opts.forEach(function(op){
    var val=Array.isArray(op)?op[0]:op,txt=Array.isArray(op)?op[1]:op;
    row.appendChild(chip(txt,o[key]===val,function(){
      o[key]=(o[key]===val)?null:val;saveState();if(after)after();renderTaste();
    }));
  });
  f.appendChild(row);parent.appendChild(f);return f;
}
function scaleField(parent,label,hint,key,scaleKey){
  var o=sess().obs,f=fieldBox(label,hint),row=chipRow();
  (SCALES[scaleKey]||[]).forEach(function(txt,i){
    var val=i+1;
    row.appendChild(chip((SCALE_SHORT[scaleKey]||SCALES[scaleKey])[i],o[key]===val,function(){
      o[key]=(o[key]===val)?null:val;saveState();renderTaste();
    },'scale'));
  });
  f.appendChild(row);parent.appendChild(f);return f;
}
function multiField(parent,label,hint,key,opts){
  var o=sess().obs;o[key]=o[key]||[];
  var f=fieldBox(label,hint),row=chipRow();
  opts.forEach(function(op){
    var val=Array.isArray(op)?op[0]:op,txt=Array.isArray(op)?op[1]:op;
    row.appendChild(chip(txt,o[key].indexOf(val)>=0,function(){
      var i=o[key].indexOf(val);if(i>=0)o[key].splice(i,1);else o[key].push(val);
      saveState();renderTaste();
    },'sm'));
  });
  f.appendChild(row);parent.appendChild(f);return f;
}
function hueField(parent){
  var o=sess().obs,fam=o.wineType||'red';
  var fams=o.wineType?[fam]:['red','white'];
  var f=fieldBox('Hue','tap the swatch that matches the core');
  fams.forEach(function(fm){
    if(fams.length>1)f.appendChild(el('div','tiny dim',fm==='red'?'Reds':'Whites'));
    var g=el('div','hues');
    (HUES[fm]||[]).forEach(function(h){
      var b=el('button','hue');b.type='button';
      b.setAttribute('aria-pressed',o.hue===h.id?'true':'false');
      b.setAttribute('aria-label',h.name);
      var sw=el('div','sw');sw.style.background=h.hex;
      b.appendChild(sw);b.appendChild(el('div','nm',h.name));
      b.onclick=function(){o.hue=(o.hue===h.id)?null:h.id;saveState();renderTaste();};
      g.appendChild(b);
    });
    f.appendChild(g);
  });
  parent.appendChild(f);
}
/* Update the step counter in place. Toggling an aroma must not re-render
   the whole view, or the search box loses its text and your focus.    */
function refreshGridCounter(){
  var c=gridCount();
  var lab=document.querySelector('#view-taste .counter');
  if(lab)lab.textContent=c.n+' of '+c.total+' observations recorded';
  var bar=document.querySelector('#view-taste .progress i');
  if(bar)bar.style.width=Math.round(c.n/c.total*100)+'%';
}
function aromaGroups(parent,key,compact){
  var o=sess().obs;o[key]=o[key]||{};
  S.ui=S.ui||{};S.ui.aromaQuery=S.ui.aromaQuery||{};S.ui.openGroups=S.ui.openGroups||{};
  var groups=AROMA_GROUPS.filter(function(g){return g.id!=='condition';});
  var counts={};               /* group id -> its count badge element */
  var chipsFor={};             /* aroma id -> every chip showing it    */
  var wrap=el('div');

  function isOn(id){return !!o[key][id];}
  function setOn(id,on){
    if(on)o[key][id]=true;else delete o[key][id];
    (chipsFor[id]||[]).forEach(function(b){b.setAttribute('aria-pressed',on?'true':'false');});
    groups.forEach(function(g){
      if(!counts[g.id])return;
      var n=g.items.filter(function(i){return isOn(i.id);}).length;
      counts[g.id].textContent=String(n);counts[g.id].setAttribute('data-n',String(n));
    });
    saveState();refreshGridCounter();drawPicked();
  }
  function aChip(it,cls){
    var b=chip(aromaLabel(it.id),isOn(it.id),function(){setOn(it.id,!isOn(it.id));},
      (cls||'sm')+(it.tell&&S.settings.showTells?' tell':''));
    (chipsFor[it.id]=chipsFor[it.id]||[]).push(b);
    return b;
  }

  /* ---- search --------------------------------------------------------- */
  var sb=el('div','asearch');
  var inp=el('input','inp');inp.type='search';inp.id='aq-'+key;
  inp.placeholder='Search all '+AROMA_LIST.length+' aromas…';
  inp.value=S.ui.aromaQuery[key]||'';
  inp.setAttribute('aria-label','Search aromas');
  inp.setAttribute('autocomplete','off');
  sb.appendChild(inp);
  wrap.appendChild(sb);

  /* ---- what you have already picked ----------------------------------- */
  var picked=el('div');wrap.appendChild(picked);
  function drawPicked(){
    picked.innerHTML='';
    var ids=[];
    groups.forEach(function(g){g.items.forEach(function(i){if(isOn(i.id))ids.push(i);});});
    if(!ids.length)return;
    var box=el('div','picked');
    var head=el('div','phead');
    head.appendChild(el('b',null,'Selected · '+ids.length));
    var clr=el('button','btn sm ghost','Clear all');
    clr.onclick=function(){ids.forEach(function(i){setOn(i.id,false);});};
    head.appendChild(clr);box.appendChild(head);
    var row=chipRow();
    ids.forEach(function(i){row.appendChild(aChip(i));});
    box.appendChild(row);picked.appendChild(box);
  }

  /* ---- palate confirmations start from what you found on the nose ----- */
  if(key==='palateConfirm'){
    var nose=groups.reduce(function(a,g){
      return a.concat(g.items.filter(function(i){return (o.aromas||{})[i.id];}));},[]);
    if(nose.length){
      var nb=el('div','picked');nb.style.borderLeft='3px solid var(--accent2)';
      var nh=el('div','phead');
      nh.appendChild(el('b',null,'From your nose notes · '+nose.length));
      var all=el('button','btn sm ghost','Mark all');
      all.onclick=function(){nose.forEach(function(i){setOn(i.id,true);});};
      nh.appendChild(all);nb.appendChild(nh);
      var nr=chipRow();
      nose.forEach(function(i){nr.appendChild(aChip(i));});
      nb.appendChild(nr);
      nb.appendChild(el('div','tiny dim','Tap the ones that carried through to the palate.'));
      wrap.appendChild(nb);
    }
  }

  /* ---- results (while searching) and the accordion (while not) -------- */
  var results=el('div');wrap.appendChild(results);
  var acc=el('div');wrap.appendChild(acc);

  groups.forEach(function(g){
    var n=g.items.filter(function(i){return isOn(i.id);}).length;
    var d=el('details','grp');
    d.open=n>0||!!S.ui.openGroups[key+':'+g.id];
    var sm=el('summary');
    sm.appendChild(el('span',null,g.name.replace(/&amp;/g,'&')));
    var cnt=el('span','cnt',String(n));cnt.setAttribute('data-n',String(n));
    counts[g.id]=cnt;sm.appendChild(cnt);d.appendChild(sm);
    /* remember what you opened, so tapping a chip elsewhere does not
       collapse the group you were reading */
    d.addEventListener('toggle',function(){S.ui.openGroups[key+':'+g.id]=d.open;});
    var body=el('div','grpbody'),row=chipRow();
    g.items.forEach(function(it){row.appendChild(aChip(it));});
    body.appendChild(row);d.appendChild(body);acc.appendChild(d);
  });

  function drawResults(){
    var q=(S.ui.aromaQuery[key]||'').trim().toLowerCase();
    results.innerHTML='';
    acc.style.display=q?'none':'';
    if(!q)return;
    var hits=[],where={};
    groups.forEach(function(g){
      var gname=g.name.replace(/&amp;/g,'&').toLowerCase();
      g.items.forEach(function(it){
        if(aromaLabel(it.id).toLowerCase().indexOf(q)>=0||
           it.id.indexOf(q)>=0||gname.indexOf(q)>=0){
          hits.push(it);where[g.id]=g.name.replace(/&amp;/g,'&');
        }
      });
    });
    if(!hits.length){
      results.appendChild(el('div','empty','Nothing matches “'+inp.value.trim()+'”.'));
      return;
    }
    results.appendChild(el('div','hitmeta',hits.length+' match'+(hits.length===1?'':'es')+
      ' in '+listSentence(Object.keys(where).map(function(k){return where[k];}))));
    var row=chipRow();
    hits.forEach(function(it){row.appendChild(aChip(it));});
    results.appendChild(row);
  }

  var clearBtn=null;
  function syncClear(){
    var q=(S.ui.aromaQuery[key]||'').trim();
    if(q&&!clearBtn){
      var r=el('div','srow');
      clearBtn=el('button','btn sm ghost','Clear search');
      clearBtn.onclick=function(){
        S.ui.aromaQuery[key]='';inp.value='';drawResults();syncClear();inp.focus();};
      r.appendChild(clearBtn);r.appendChild(el('span','tiny dim','showing matches across every category'));
      sb.appendChild(r);
    }else if(!q&&clearBtn){
      sb.removeChild(clearBtn.parentNode);clearBtn=null;
    }
  }
  inp.addEventListener('input',function(){
    S.ui.aromaQuery[key]=inp.value;drawResults();syncClear();});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')e.preventDefault();});

  drawPicked();drawResults();syncClear();
  parent.appendChild(wrap);
}
/* labelled segmented bar: expected band + where the taster's call sits */
function rangeBar(scaleKey,range,youVal,label){
  var w=el('div','bar'),lab=el('div','barlab');
  lab.appendChild(el('span',null,label||scaleKey));
  lab.appendChild(el('span',null,range?rangeWords(scaleKey,range):'—'));
  w.appendChild(lab);
  var seg=el('div','barseg'),arr=SCALE_SHORT[scaleKey]||SCALES[scaleKey]||[];
  arr.forEach(function(t,i){
    var cls='';
    if(range&&i+1>=range[0]&&i+1<=range[1])cls+=' in';
    if(youVal===i+1)cls+=' you';
    var b=el('i',cls.trim());b.title=t;seg.appendChild(b);
  });
  w.appendChild(seg);
  var ticks=el('div','barticks');
  arr.forEach(function(t){ticks.appendChild(el('span',null,t));});
  w.appendChild(ticks);
  return w;
}
</script>
<script>
"use strict";
/* ================================================ 5. TASTE VIEW ========= */
var STEPS=[{k:'sight',n:'Sight'},{k:'nose',n:'Nose'},{k:'palate',n:'Palate'},
           {k:'conclusion',n:'Conclude'},{k:'guess',n:'Call'},{k:'reveal',n:'Reveal'}];
/* Every entry here is optional. The counter exists to show coverage, not
   to demand it — a skipped field contributes nothing to the engine.     */
var GRID_FIELDS=[
 ['sight','wineType'],['sight','clarity'],['sight','concentration'],['sight','hue'],
 ['sight','rim'],['sight','legs'],['sight','gumStain'],['sight','bubbles'],
 ['nose','condition'],['nose','aromas'],['nose','noseIntensity'],
 ['palate','sweetness'],['palate','acidity'],['palate','tannin'],['palate','tanninTexture'],
 ['palate','alcohol'],['palate','body'],['palate','mouthfeel'],['palate','flavorIntensity'],
 ['palate','finish'],['palate','palateConfirm'],['palate','palateOnly'],
 ['palate','balance'],['palate','finishesOn'],['palate','quality'],
 ['conclusion','world'],['conclusion','climate'],['conclusion','vintage'],['conclusion','winemaking']
];
function answered(obs,k){
  var v=obs[k];
  if(v==null||v==='')return false;
  if(Array.isArray(v))return v.length>0;
  if(typeof v==='object')return Object.keys(v).length>0;
  return true;
}
function gridCount(){
  var o=sess().obs,tot=GRID_FIELDS.length,n=0;
  GRID_FIELDS.forEach(function(f){if(answered(o,f[1]))n++;});
  if(!showTannin())tot-=2;
  return {n:n,total:tot};
}
function showTannin(){
  var o=sess().obs;
  return o.wineType!=='white'&&o.wineType!=='sparkling'||S.settings.tanninOnWhites;
}
function stepHeader(root){
  var s=sess(),c=gridCount();
  var nav=el('div','steps');
  STEPS.forEach(function(st,i){
    var b=el('button',i<s.step?'done':'',st.n);
    if(i===s.step)b.setAttribute('aria-current','step');
    b.onclick=function(){
      if(i>4&&!s.result)return toast('Commit your own call first.');
      if(i<5&&s.scored)return toast('This session is scored — start a new tasting to change the grid.');
      if(i===4&&s.step>4)return toast('Your call is locked in for this session.');
      s.step=i;saveState();renderTaste();};
    nav.appendChild(b);
  });
  var wrap=el('div','railwrap');wrap.appendChild(nav);root.appendChild(wrap);
  setTimeout(function(){
    var cur=nav.querySelector('[aria-current="step"]');
    if(cur)nav.scrollLeft=Math.max(0,cur.offsetLeft-48);
    wrap.classList.toggle('more',nav.scrollWidth>nav.clientWidth+4);
  },0);
  nav.addEventListener('scroll',function(){
    wrap.classList.toggle('more',nav.scrollLeft+nav.clientWidth<nav.scrollWidth-4);
  });
  if(s.step<4){
    var bar=el('div','progress');var i2=el('i');
    i2.style.width=Math.round(c.n/c.total*100)+'%';bar.appendChild(i2);
    var row=el('div','spread');row.style.margin='0 0 10px';
    row.appendChild(el('span','counter',c.n+' of '+c.total+' observations recorded'));
    if(s.mode==='practice')row.appendChild(el('span','badge','practice'));
    if(s.peeked)row.appendChild(el('span','badge peek','peeked at codex'));
    root.appendChild(bar);root.appendChild(row);
  }
}
function stepFooter(root,nextLabel,onNext){
  var s=sess(),row=el('div','btnrow');row.style.marginTop='16px';
  if(s.step>0){
    var back=el('button','btn ghost','← Back');
    back.onclick=function(){s.step--;saveState();renderTaste();};row.appendChild(back);
  }
  var next=el('button','btn primary',nextLabel||'Next →');
  next.onclick=onNext||function(){s.step++;saveState();renderTaste();};
  row.appendChild(next);root.appendChild(row);
}
function renderTaste(){
  var root=$('view-taste');root.innerHTML='';
  var s=sess();
  $('ctxLabel').textContent=s.mode==='practice'?'practice drill':'deductive tasting';
  stepHeader(root);
  var card=el('div','card');
  if(s.mode==='practice'&&s.profile)renderPracticeBrief(card);
  var steps={0:stepSight,1:stepNose,2:stepPalate,3:stepConclusion,4:stepGuess,5:stepReveal};
  if(!s.obs||typeof s.obs!=='object')s.obs={aromas:{},palateConfirm:{}};
  if(!steps[s.step]||(s.step===5&&!(s.result&&s.result.top))){s.step=0;saveState();}
  steps[s.step](card);
  root.appendChild(card);
  if(s.step<4){
    var tools=el('div','row');tools.style.marginTop='4px';
    var codexBtn=el('button','btn sm ghost','Open Codex (logs a peek)');
    codexBtn.onclick=function(){
      s.peeked=true;saveState();toast('Peeking — this session will be flagged.');setView('codex');};
    var recallBtn=el('button','btn sm ghost','Tasted this before? (logs a peek)');
    recallBtn.onclick=function(){
      s.peeked=true;saveState();renderTaste();
      openModal('Your past notes',function(sh){
        sh.appendChild(el('p','muted small','Checking the grid so far against sessions where you recorded the bottle. This session is now flagged as peeked.'));
        similarPanel(sh,s.obs,{excludeId:s.id,limit:8});
      });
    };
    var reset=el('button','btn sm ghost','Abandon session');
    reset.onclick=function(){
      openModal('Abandon this session?',function(sh){
        sh.appendChild(el('p','muted','The grid you have filled in will be discarded. History is not affected.'));
        var r=el('div','btnrow');
        var no=el('button','btn ghost','Keep tasting');no.onclick=closeModal;
        var yes=el('button','btn primary','Discard');
        yes.onclick=function(){newSession('blind');closeModal();renderTaste();};
        r.appendChild(no);r.appendChild(yes);sh.appendChild(r);
      });
    };
    tools.appendChild(codexBtn);tools.appendChild(recallBtn);tools.appendChild(reset);
    root.appendChild(tools);
  }
}

/* --------------------------------------------------------------- SIGHT - */
function stepSight(c){
  var o=sess().obs;
  c.appendChild(el('h2',null,'Sight'));
  c.appendChild(el('p','muted small','Record what is in the glass before you name anything. Skip whatever you cannot see.'));
  var types=WINE_TYPES.filter(function(t){return S.settings.extraTypes||CORE_TYPES.indexOf(t[0])>=0;});
  singleField(c,'Wine type',null,'wineType',types,function(){
    /* HUES.sparkling/.fortified are aliases of white/red, so compare the
       hue's family against the family this type actually uses          */
    var fam=o.wineType==='sparkling'?'white':o.wineType==='fortified'?'red':o.wineType;
    if(o.hue&&HUE_INDEX[o.hue]&&fam&&HUE_INDEX[o.hue].fam!==fam)o.hue=null;
    /* B3: drop what the new type no longer asks for, rather than keeping
       it as an invisible observation that still counts and still scores */
    if(!showTannin()){o.tannin=null;o.tanninTexture=[];}
    if(o.wineType==='white'||o.wineType==='sparkling')o.gumStain=null;
  });
  singleField(c,'Clarity',null,'clarity',CLARITY);
  scaleField(c,'Concentration','depth of the core','concentration','concentration');
  hueField(c);
  singleField(c,'Rim variation','a wide watery rim on a red is an age or dilution tell','rim',RIM);
  singleField(c,'Tears / legs',null,'legs',LEGS);
  if(o.wineType!=='white')
    singleField(c,'Gum staining',null,'gumStain',GUMSTAIN);
  singleField(c,'Bubbles, sediment, gas',null,'bubbles',BUBBLES);
  stepFooter(c,'Nose →');
}
/* ---------------------------------------------------------------- NOSE - */
function stepNose(c){
  c.appendChild(el('h2',null,'Nose'));
  c.appendChild(el('p','muted small','Select as many as you find. Chips marked ◆ are diagnostic tells and carry extra weight.'));
  multiField(c,'Fruit condition',null,'condition',AROMA_GROUPS[0].items.map(function(i){return [i.id,i.label];}));
  var f=fieldBox('Aromas','search, or open a category');
  c.appendChild(f);aromaGroups(c,'aromas',false);
  scaleField(c,'Aromatic intensity',null,'noseIntensity','intensity');
  stepFooter(c,'Palate →');
}
/* -------------------------------------------------------------- PALATE - */
function stepPalate(c){
  var o=sess().obs;
  c.appendChild(el('h2',null,'Palate'));
  scaleField(c,'Sweetness',null,'sweetness','sweetness');
  scaleField(c,'Acidity',null,'acidity','acidity');
  if(showTannin()){
    scaleField(c,'Tannin — level',null,'tannin','tannin');
    multiField(c,'Tannin — texture',null,'tanninTexture',TANNIN_TEXTURE);
  }else{
    var note=el('div','field');
    note.appendChild(el('div','tiny dim','Tannin hidden for whites. Skin-contact whites do have tannin — enable it in Settings if you need it.'));
    c.appendChild(note);
  }
  scaleField(c,'Alcohol',null,'alcohol','alcohol');
  scaleField(c,'Body',null,'body','body');
  multiField(c,'Mouthfeel / texture',null,'mouthfeel',MOUTHFEEL);
  scaleField(c,'Flavour intensity',null,'flavorIntensity','intensity');
  scaleField(c,'Finish length',null,'finish','finish');
  c.appendChild(el('hr','sep'));
  c.appendChild(el('h3',null,'Palate confirmations'));
  c.appendChild(el('p','muted small','Which of the aromas actually carried onto the palate? Your nose notes are listed first — or search.'));
  aromaGroups(c,'palateConfirm',true);
  multiField(c,'Palate-only descriptors',null,'palateOnly',PALATE_ONLY);
  c.appendChild(el('hr','sep'));
  c.appendChild(el('h3',null,'Structural read'));
  singleField(c,'Balance',null,'balance',BALANCE);
  singleField(c,'Where it finishes',null,'finishesOn',FINISH_ON);
  singleField(c,'Perceived quality',null,'quality',QUALITY);
  stepFooter(c,'Conclude →');
}
/* ---------------------------------------------------------- CONCLUSION - */
function stepConclusion(c){
  c.appendChild(el('h2',null,'Conclusion'));
  c.appendChild(el('p','muted small','Optional reads that feed the engine. Skip any you are not willing to commit to.'));
  singleField(c,'Old World / New World',null,'world',WORLDS);
  singleField(c,'Climate',null,'climate',CLIMATES);
  singleField(c,'Vintage range',null,'vintage',VINTAGES);
  multiField(c,'Winemaking signals',null,'winemaking',WINEMAKING);
